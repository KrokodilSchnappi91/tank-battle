<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="screen-orientation" content="landscape">
<title>🎮 坦克大战 - Battle City</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Courier New', 'Microsoft YaHei', monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }

  .game-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 4px;
    width: 100vw;
    height: 100vh;
    max-width: 100vw;
    max-height: 100vh;
  }

  .game-header {
    display: none;
  }

  .game-title {
    font-size: clamp(12px, 3vw, 20px);
    font-weight: bold;
    color: #e94560;
    text-shadow: 0 0 10px rgba(233,69,96,0.5);
    letter-spacing: 2px;
    white-space: nowrap;
  }

  .game-stats {
    display: flex;
    gap: 6px;
    color: #eee;
    font-size: 10px;
    flex-wrap: wrap;
  }

  .stat {
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .stat-label {
    color: #888;
    font-size: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
    white-space: nowrap;
  }

  .stat-value {
    color: #0f3460;
    background: #e94560;
    padding: 1px 6px;
    border-radius: 3px;
    font-weight: bold;
    font-size: 12px;
    min-width: 24px;
    text-align: center;
  }

  /* 游戏主区域：全屏画布 */
  .game-main {
    position: relative;
    flex: 1;
    width: 100%;
    min-height: 0;
    overflow: hidden;
  }

  .canvas-container {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  canvas {
    border: none;
    border-radius: 0;
    background: #0a0a0a;
    image-rendering: pixelated;
    display: block;
    cursor: crosshair;
    max-width: 100%;
    max-height: 100%;
  }

  .game-controls {
    display: flex;
    gap: 12px;
    align-items: center;
    color: #888;
    font-size: 10px;
    flex-wrap: wrap;
    justify-content: center;
    flex-shrink: 0;
  }

  .key-hint {
    background: #16213e;
    padding: 2px 6px;
    border-radius: 3px;
    border: 1px solid #333;
    letter-spacing: 1px;
    white-space: nowrap;
  }

  .key-hint span { color: #e94560; font-weight: bold; }

  /* ====== 双摇杆（浮在画布上） ====== */
  .touch-controls {
    display: none;
    position: absolute;
    z-index: 5;
    pointer-events: none;
  }
  .touch-controls > * { pointer-events: auto; }

  .touch-side {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    position: absolute;
    bottom: 16px;
  }
  #touchMove { left: 16px; bottom: 16px; }
  #touchAim { right: 16px; bottom: 16px; }

  .joystick-area {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.25);
    position: relative;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }

  .joystick-knob {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(233,69,96,0.5);
    border: 2px solid rgba(233,69,96,0.7);
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    transition: none;
  }

  .joystick-label {
    text-align: center;
    color: rgba(255,255,255,0.5);
    font-size: 9px;
    margin-top: 2px;
    letter-spacing: 1px;
  }

  .center-btns {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    margin-top: 6px;
  }

  .btn-pause-mobile, .btn-fullscreen {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    font-size: 13px;
  }
  .btn-pause-mobile {
    background: rgba(255,255,255,0.12);
    border: 1.5px solid rgba(255,255,255,0.3);
    color: #aaa;
  }
  .btn-fullscreen {
    background: rgba(78,205,196,0.25);
    border: 1.5px solid rgba(78,205,196,0.5);
    color: #4ecdc4;
  }

  .overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }

  .overlay-content {
    text-align: center;
    color: #eee;
    padding: 20px;
    max-width: 90vw;
    max-height: 90vh;
    overflow-y: auto;
  }

  .overlay-content h1 {
    font-size: clamp(28px, 8vw, 48px);
    color: #e94560;
    margin-bottom: 10px;
    text-shadow: 0 0 20px rgba(233,69,96,0.6);
  }

  .overlay-content h2 {
    font-size: clamp(20px, 6vw, 28px);
    color: #e94560;
    margin-bottom: 16px;
  }

  .overlay-content p {
    margin: 6px 0;
    color: #aaa;
    font-size: clamp(12px, 3vw, 14px);
  }

  .btn {
    display: inline-block;
    margin-top: 16px;
    padding: 12px 36px;
    font-size: clamp(16px, 4vw, 18px);
    font-weight: bold;
    font-family: inherit;
    color: #fff;
    background: #e94560;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 2px;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:hover {
    background: #ff6b81;
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(233,69,96,0.5);
  }

  .hidden { display: none !important; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  @keyframes victoryText {
    0% { transform: scale(0.3); opacity: 0; }
    50% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* 触屏设备：横屏布局 */
  @media (max-width: 768px), (hover: none) and (pointer: coarse) {
    .touch-controls { display: flex !important; }
    .game-controls.desktop-only { display: none; }
    body { padding: 0; }
    .game-wrapper { padding: 2px; gap: 1px; }
  }

  /* 桌面：隐藏触屏控制 */
  @media (min-width: 769px) and (hover: hover) and (pointer: fine) {
    .touch-controls { display: none !important; }
    .game-controls.desktop-only { display: flex; }
  }
</style>
</head>
<body>

<div class="game-wrapper">
  <div class="game-header">
    <div class="game-title">🎮 坦 克 大 战</div>
    <div class="game-stats">
      <div class="stat">
        <span class="stat-label">得分</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">关卡</span>
        <span class="stat-value" id="level">1</span>
      </div>
      <div class="stat">
        <span class="stat-label">生命</span>
        <span class="stat-value" id="lives">10</span>
      </div>
      <div class="stat">
        <span class="stat-label">击杀</span>
        <span class="stat-value" id="kills">0</span>
      </div>
      <div class="stat" id="streakStat" style="display:none">
        <span class="stat-label">连杀</span>
        <span class="stat-value" id="streakDisplay" style="background:#ffd700;color:#000;">0</span>
      </div>
    </div>
  </div>

  <!-- 游戏主区域：横屏三栏布局 -->
  <div class="game-main">
    <!-- 左摇杆：移动 -->
    <div class="touch-controls touch-side" id="touchMove">
      <div class="joystick-area" id="moveJoystick">
        <div class="joystick-knob" id="moveKnob"></div>
      </div>
      <div class="joystick-label">移动</div>
    </div>

    <!-- 中央画布 -->
    <div class="canvas-container">
      <canvas id="gameCanvas"></canvas>
    </div>

    <!-- 右摇杆：瞄准射击 -->
    <div class="touch-controls touch-side" id="touchAim">
      <div class="joystick-area" id="aimJoystick">
        <div class="joystick-knob" id="aimKnob"></div>
      </div>
      <div class="joystick-label">瞄准·射击</div>
      <div class="center-btns" style="margin-top:4px;">
        <button class="btn-fullscreen" id="btnFullscreen">📺</button>
        <button class="btn-pause-mobile" id="btnPause">⏸</button>
      </div>
    </div>
  </div>

  <!-- 桌面键盘提示 -->
  <div class="game-controls desktop-only">
    <div class="key-hint"><span>WASD</span> 移动</div>
    <div class="key-hint"><span>鼠标</span> 瞄准</div>
    <div class="key-hint"><span>左键/J</span> 射击</div>
    <div class="key-hint"><span>空格</span> 冲刺</div>
    <div class="key-hint"><span>P</span> 暂停</div>
  </div>
</div>

<!-- 横屏提示（手机竖屏时显示） -->
<div class="overlay hidden" id="rotatePrompt" style="background:rgba(0,0,0,0.9);z-index:100;">
  <div class="overlay-content">
    <h2 style="font-size:48px;">📱🔄</h2>
    <p style="font-size:20px;color:#fff;">请旋转手机至横屏模式</p>
    <p style="color:#888;">横屏体验更佳</p>
  </div>
</div>

<!-- 开始界面 -->
<div class="overlay" id="startOverlay">
  <div class="overlay-content">
    <h1>🎮 坦克大战</h1>
    <p>消灭所有敌方坦克！手机请横屏游玩</p>
    <button class="btn" id="startFullscreenBtn" style="background:#4ecdc4;font-size:14px;padding:8px 20px;margin-top:4px;">📺 横屏全屏模式</button>
    <p style="margin-top:12px; color:#666;">🏗️ 棕色砖墙可被摧毁</p>
    <p style="color:#666;">🔩 灰色钢墙坚不可摧</p>
    <p style="color:#666;">🌲 草丛隐藏坦克行踪</p>
    <!-- 关卡选择 -->
    <p style="margin-top:14px;color:#aaa;">选择关卡 (1-66)</p>
    <div id="levelGrid" style="display:grid;grid-template-columns:repeat(11,1fr);gap:3px;max-width:420px;margin:0 auto;max-height:180px;overflow-y:auto;padding:4px;background:#111;border-radius:6px;">
    </div>
    <p style="color:#666;font-size:11px;margin-top:4px;" id="selectedLevelText">已选：第 1 关</p>
    <button class="btn" id="startBtn">🆕 新 游 戏</button>
    <div style="margin-top:12px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;" id="saveSlotsContainer">
      <button class="btn save-slot-btn" data-slot="1" style="background:#4ecdc4;font-size:13px;padding:10px 16px;">存档 1</button>
      <button class="btn save-slot-btn" data-slot="2" style="background:#4ecdc4;font-size:13px;padding:10px 16px;">存档 2</button>
      <button class="btn save-slot-btn" data-slot="3" style="background:#4ecdc4;font-size:13px;padding:10px 16px;">存档 3</button>
    </div>
  </div>
</div>

<!-- 暂停界面 -->
<div class="overlay hidden" id="pauseOverlay">
  <div class="overlay-content">
    <h2>⏸️ 游戏暂停</h2>
    <p>按 <span style="color:#e94560;">P</span> 或点击按钮继续</p>
    <button class="btn" id="resumeBtn">继 续</button>
  </div>
</div>

<!-- 存档选择界面 -->
<div class="overlay hidden" id="savePromptOverlay">
  <div class="overlay-content">
    <h2>💾 是否存档？</h2>
    <p>当前进度：第 <span id="savePromptLevel" style="color:#e94560;"></span> 关</p>
    <div style="display:flex; gap:16px; justify-content:center; margin-top:16px;">
      <button class="btn" id="saveYesBtn" style="background:#4ecdc4;">💾 存档</button>
      <button class="btn" id="saveNoBtn" style="background:#666;">跳过</button>
    </div>
  </div>
</div>

<!-- 游戏结束界面 -->
<div class="overlay hidden" id="gameOverOverlay">
  <div class="overlay-content">
    <h2 id="gameOverTitle">💥 游戏结束</h2>
    <p>最终得分: <span style="color:#e94560;font-size:24px;" id="finalScore">0</span></p>
    <p>击杀数: <span id="finalKills">0</span></p>
    <p>到达关卡: <span id="finalLevel">1</span></p>
    <button class="btn" id="restartBtn">重 新 开 始</button>
    <button class="btn hidden" id="continueBtn" style="background:#4ecdc4;">继续游戏</button>
  </div>
</div>

<script>
// ==================== 触屏检测与自适应 ====================
const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
const isSmallScreen = window.innerWidth <= 768;

// Canvas 尺寸自适应
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const COLS = 34;
const ROWS = 20;
const BASE_CELL = 24;  // 基础单元格大小
let CELL = BASE_CELL;
let scaleFactor = 1;

function resizeCanvas() {
  const footerH = document.querySelector('.game-controls.desktop-only')?.offsetHeight || 0;
  const maxWidth = window.innerWidth;
  const maxHeight = window.innerHeight - footerH;

  const gameW = COLS * BASE_CELL;
  const gameH = ROWS * BASE_CELL;

  scaleFactor = Math.min(maxWidth / gameW, maxHeight / gameH, 1.5);
  CELL = Math.floor(BASE_CELL * scaleFactor);

  canvas.width = COLS * CELL;
  canvas.height = ROWS * CELL;
}

resizeCanvas();
window.addEventListener('resize', () => {
  resizeCanvas();
});

window.addEventListener('orientationchange', () => {
  setTimeout(resizeCanvas, 200);
});

// ==================== 游戏引擎 ====================

// 游戏状态
const STATE = {
  MENU: 'menu',
  PLAYING: 'playing',
  PAUSED: 'paused',
  GAMEOVER: 'gameover'
};

let gameState = STATE.MENU;
let score = 0;
let level = 1;
let lives = 10;
let kills = 0;
let killStreak = 0;           // 连续击杀数
let mythicMode = false;       // 神话模式
// 冲刺系统
let dashState = null;         // { dir, timer, maxTimer }
let stamina = 100;            // 体力值
let mouseX = 0, mouseY = 0;   // 鼠标在canvas上的坐标
let mouseOnCanvas = false;    // 鼠标是否在canvas上
const MAX_STAMINA = 100;
const DASH_COST = 30;         // 冲刺消耗
let deathTimer = 0;           // 死亡重生倒计时
let bossActive = false;       // Boss 战中
let bossTank = null;          // Boss 坦克引用
let bossPhase = 1;            // Boss 当前阶段
let nukes = [];               // 核弹列表
let bossKillCount = 0;        // Boss击杀总数（跨关卡）
let demonKingActive = false;  // 魔王战中
let victoryTimer = 0;          // 胜利动画计时器
let victoryParticles = [];     // 胜利烟花粒子
let healthSpawnTimer = 0;      // 血包生成计时器
let enemiesRemaining = 0;
let enemiesOnScreen = 0;
let maxEnemiesOnScreen = 4;
let enemySpawnTimer = 0;
let enemySpawnDelay = 90;
let baseEnemySpeed = 1.0;
let animationId = null;

// 输入处理 - 键盘 + 触屏虚拟按键
const keys = {};
const touchKeys = {}; // 触屏模拟的按键
const lastKeyTime = {}; // 双击检测

function isKeyDown(key) {
  return !!(keys[key] || touchKeys[key]);
}

window.addEventListener('keydown', e => {
  keys[e.key] = true;
  keys[e.code] = true;

  // 空格键触发冲刺（需体力足够，朝当前移动方向冲刺）
  if (e.code === 'Space' && !dashState && player && player.alive && stamina >= DASH_COST) {
    // 使用当前车身方向冲刺
    const dashDir = player.dir;
    const mythicBoost = mythicMode ? 1.5 : 1;
    dashState = {
      dir: dashDir,
      timer: Math.floor(13 * mythicBoost),
      maxTimer: Math.floor(13 * mythicBoost),
      mythic: mythicMode
    };
    stamina -= DASH_COST;
  }

  if (['KeyW','KeyA','KeyS','KeyD','Space','KeyJ'].includes(e.code)) {
    e.preventDefault();
  }
});

window.addEventListener('keyup', e => {
  keys[e.key] = false;
  keys[e.code] = false;
  if (['KeyW','KeyA','KeyS','KeyD','Space','KeyJ'].includes(e.code)) {
    e.preventDefault();
  }
});

// ====== 双摇杆触屏控制（多点触控独立跟踪） ======
let moveJoy = { active: false, dx: 0, dy: 0, touchId: null };
let aimJoy = { active: false, dx: 0, dy: 0, touchId: null };

function setupJoystick(areaId, knobId, stateObj) {
  const area = document.getElementById(areaId);
  const knob = document.getElementById(knobId);
  if (!area || !knob) return;

  const findTouch = (e) => {
    if (stateObj.touchId === null) return null;
    for (let i = 0; i < e.touches.length; i++) {
      if (e.touches[i].identifier === stateObj.touchId) return e.touches[i];
    }
    return null;
  };

  const updateKnob = (clientX, clientY) => {
    const rect = area.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const maxR = rect.width / 2 - 20;
    let dx = clientX - cx;
    let dy = clientY - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > maxR) { dx = dx / dist * maxR; dy = dy / dist * maxR; }
    stateObj.dx = dx / Math.max(maxR, 1);
    stateObj.dy = dy / Math.max(maxR, 1);
    knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  };

  area.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (stateObj.touchId !== null) return; // 已有手指
    const t = e.changedTouches[0];
    stateObj.touchId = t.identifier;
    stateObj.active = true;
    updateKnob(t.clientX, t.clientY);
  }, { passive: false });

  area.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = findTouch(e);
    if (!t) return;
    updateKnob(t.clientX, t.clientY);
  }, { passive: false });

  area.addEventListener('touchend', (e) => {
    const t = findTouch(e);
    if (!t && e.changedTouches.length > 0) {
      // 检查是否是我们的手指
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === stateObj.touchId) {
          stateObj.touchId = null;
          stateObj.active = false;
          stateObj.dx = 0;
          stateObj.dy = 0;
          knob.style.transform = 'translate(-50%, -50%)';
          return;
        }
      }
      return;
    }
    stateObj.touchId = null;
    stateObj.active = false;
    stateObj.dx = 0;
    stateObj.dy = 0;
    knob.style.transform = 'translate(-50%, -50%)';
  });

  area.addEventListener('touchcancel', () => {
    stateObj.touchId = null;
    stateObj.active = false;
    stateObj.dx = 0;
    stateObj.dy = 0;
    knob.style.transform = 'translate(-50%, -50%)';
  });

  // 桌面鼠标支持
  area.addEventListener('mousedown', (e) => {
    stateObj.active = true;
    updateKnob(e.clientX, e.clientY);
  });
  window.addEventListener('mousemove', (e) => {
    if (stateObj.active && stateObj.touchId === null) updateKnob(e.clientX, e.clientY);
  });
  window.addEventListener('mouseup', () => {
    if (stateObj.touchId === null) {
      stateObj.active = false;
      stateObj.dx = 0;
      stateObj.dy = 0;
      knob.style.transform = 'translate(-50%, -50%)';
    }
  });
}

setupJoystick('moveJoystick', 'moveKnob', moveJoy);
setupJoystick('aimJoystick', 'aimKnob', aimJoy);

// 横屏全屏按钮
document.getElementById('btnFullscreen')?.addEventListener('click', () => {
  // 尝试锁定横屏
  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock('landscape').catch(() => {});
  }
  // 请求全屏
  const el = document.documentElement;
  if (el.requestFullscreen) {
    el.requestFullscreen().catch(() => {});
  } else if (el.webkitRequestFullscreen) {
    el.webkitRequestFullscreen();
  }
});
document.getElementById('btnFullscreen')?.addEventListener('touchstart', (e) => {
  e.preventDefault();
  e.stopPropagation();
  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock('landscape').catch(() => {});
  }
  const el = document.documentElement;
  if (el.requestFullscreen) {
    el.requestFullscreen().catch(() => {});
  } else if (el.webkitRequestFullscreen) {
    el.webkitRequestFullscreen();
  }
});

// 暂停按钮
document.getElementById('btnPause')?.addEventListener('click', () => {
  if (gameState === STATE.PLAYING) pauseGame();
  else if (gameState === STATE.PAUSED) resumeGame();
});
document.getElementById('btnPause')?.addEventListener('touchstart', (e) => {
  e.preventDefault();
  e.stopPropagation();
  if (gameState === STATE.PLAYING) pauseGame();
  else if (gameState === STATE.PAUSED) resumeGame();
});

// 鼠标跟踪（炮塔瞄准）
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) / rect.width * COLS;
  mouseY = (e.clientY - rect.top) / rect.height * ROWS;
  mouseOnCanvas = true;
});
canvas.addEventListener('mouseleave', () => { mouseOnCanvas = false; });
// 左键射击
canvas.addEventListener('mousedown', (e) => {
  if (e.button === 0 && gameState === STATE.PLAYING && player && player.alive) {
    e.preventDefault();
    player.shoot();
  }
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

// 防止 canvas 上的触摸滚动
canvas.addEventListener('touchstart', (e) => e.preventDefault());
canvas.addEventListener('touchmove', (e) => e.preventDefault());

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎮 坦克大战 - Battle City</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Courier New', 'Microsoft YaHei', monospace;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }

  .game-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 8px;
    max-width: 100vw;
  }

  .game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 640px;
    padding: 6px 12px;
    background: #16213e;
    border: 2px solid #e94560;
    border-radius: 8px;
    flex-wrap: wrap;
    gap: 6px;
  }

  .game-title {
    font-size: clamp(16px, 4vw, 24px);
    font-weight: bold;
    color: #e94560;
    text-shadow: 0 0 10px rgba(233,69,96,0.5);
    letter-spacing: 2px;
    white-space: nowrap;
  }

  .game-stats {
    display: flex;
    gap: 10px;
    color: #eee;
    font-size: 11px;
    flex-wrap: wrap;
  }

  .stat {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .stat-label {
    color: #888;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1px;
    white-space: nowrap;
  }

  .stat-value {
    color: #0f3460;
    background: #e94560;
    padding: 1px 8px;
    border-radius: 4px;
    font-weight: bold;
    font-size: 14px;
    min-width: 32px;
    text-align: center;
  }

  .canvas-container {
    position: relative;
    line-height: 0;
  }

  canvas {
    border: 3px solid #0f3460;
    border-radius: 4px;
    background: #0a0a0a;
    image-rendering: pixelated;
    box-shadow: 0 0 30px rgba(233,69,96,0.2), inset 0 0 60px rgba(0,0,0,0.3);
    max-width: 100vw;
    max-height: 60vh;
    display: block;
  }

  .game-controls {
    display: flex;
    gap: 16px;
    align-items: center;
    color: #888;
    font-size: 11px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .key-hint {
    background: #16213e;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid #333;
    letter-spacing: 1px;
    white-space: nowrap;
  }

  .key-hint span {
    color: #e94560;
    font-weight: bold;
  }

  /* ====== 触屏控制 ====== */
  .touch-controls {
    display: none;
    width: 100%;
    max-width: 640px;
    justify-content: space-between;
    align-items: center;
    padding: 4px 8px;
  }

  .dpad {
    display: grid;
    grid-template-columns: 60px 60px 60px;
    grid-template-rows: 60px 60px 60px;
    gap: 2px;
  }

  .dpad-btn {
    width: 60px;
    height: 60px;
    background: rgba(233, 69, 96, 0.25);
    border: 2px solid rgba(233, 69, 96, 0.5);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: rgba(255,255,255,0.7);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.1s;
  }

  .dpad-btn:active,
  .dpad-btn.active {
    background: rgba(233, 69, 96, 0.7);
    border-color: #e94560;
    color: #fff;
  }

  .dpad-empty {
    width: 60px;
    height: 60px;
  }

  .dpad-up { grid-column: 2; grid-row: 1; }
  .dpad-left { grid-column: 1; grid-row: 2; }
  .dpad-center { grid-column: 2; grid-row: 2; }
  .dpad-right { grid-column: 3; grid-row: 2; }
  .dpad-down { grid-column: 2; grid-row: 3; }

  .fire-area {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
  }

  .btn-fire {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(233,69,96,0.5), rgba(233,69,96,0.2));
    border: 3px solid #e94560;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    font-family: inherit;
    letter-spacing: 2px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.1s;
    text-shadow: 0 0 8px rgba(233,69,96,0.8);
  }

  .btn-fire:active,
  .btn-fire.active {
    background: radial-gradient(circle, #e94560, #c0392b);
    transform: scale(0.92);
    box-shadow: 0 0 25px rgba(233,69,96,0.8);
  }

  .btn-pause-mobile {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.3);
    color: #aaa;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }

  .overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }

  .overlay-content {
    text-align: center;
    color: #eee;
    padding: 20px;
    max-width: 90vw;
  }

  .overlay-content h1 {
    font-size: clamp(28px, 8vw, 48px);
    color: #e94560;
    margin-bottom: 10px;
    text-shadow: 0 0 20px rgba(233,69,96,0.6);
  }

  .overlay-content h2 {
    font-size: clamp(20px, 6vw, 28px);
    color: #e94560;
    margin-bottom: 16px;
  }

  .overlay-content p {
    margin: 6px 0;
    color: #aaa;
    font-size: clamp(12px, 3vw, 14px);
  }

  .btn {
    display: inline-block;
    margin-top: 16px;
    padding: 12px 36px;
    font-size: clamp(16px, 4vw, 18px);
    font-weight: bold;
    font-family: inherit;
    color: #fff;
    background: #e94560;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 2px;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:hover {
    background: #ff6b81;
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(233,69,96,0.5);
  }

  .hidden { display: none !important; }

  /* 小屏幕：显示触屏控制 */
  @media (max-width: 768px), (hover: none) and (pointer: coarse) {
    .touch-controls {
      display: flex;
    }
    .game-controls.desktop-only {
      display: none;
    }
    body {
      align-items: flex-start;
      padding-top: 4px;
    }
  }

  /* 大屏幕：隐藏触屏控制 */
  @media (min-width: 769px) and (hover: hover) and (pointer: fine) {
    .touch-controls {
      display: none;
    }
    .game-controls.desktop-only {
      display: flex;
    }
  }
</style>
</head>

      </div>

        <span class="stat-value" id="level">1</span>
      </div>

        <span class="stat-label">生命</span>

    <canvas id="gameCanvas"></canvas>
  </div>

  <!-- 桌面键盘提示 -->
  <div class="game-controls desktop-only">
    <div class="key-hint"><span>↑↓←→</span> 移动</div>
    <div class="key-hint"><span>空格</span> 射击</div>

  <div class="touch-controls" id="touchControls">
    <div class="dpad" id="dpad">
      <button class="dpad-btn dpad-up" id="btnUp">▲</button>
      <button class="dpad-btn dpad-left" id="btnLeft">◄</button>
      <button class="dpad-btn dpad-center" id="btnCenter" style="font-size:12px;color:#666;">P</button>
      <button class="dpad-btn dpad-right" id="btnRight">►</button>
      <button class="dpad-btn dpad-down" id="btnDown">▼</button>
    </div>
    <div class="fire-area">
      <button class="btn-fire" id="btnFire">开火</button>
      <button class="btn-pause-mobile" id="btnPause">⏸️</button>

</div>

<!-- 开始界面 -->
<div class="overlay" id="startOverlay">
  <div class="overlay-content">

    <p>消灭所有敌方坦克！</p>

    <p style="color:#666;">🔩 灰色钢墙坚不可摧</p>
    <p style="color:#666;">🌲 草丛隐藏坦克行踪</p>
    <button class="btn" id="startBtn">开 始 游 戏</button>
  </div>
</div>

<!-- 暂停界面 -->
<div class="overlay hidden" id="pauseOverlay">

</div>

<div class="overlay hidden" id="gameOverOverlay">

    <p>到达关卡: <span id="finalLevel">1</span></p>
    <button class="btn" id="restartBtn">再 来 一 局</button>
  </div>
</div>

<script>
// ==================== 触屏检测与自适应 ====================
const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
const isSmallScreen = window.innerWidth <= 768;

// Canvas 尺寸自适应
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const COLS = 26;
const ROWS = 26;
const BASE_CELL = 24;  // 基础单元格大小
let CELL = BASE_CELL;
let scaleFactor = 1;

function resizeCanvas() {
  const maxWidth = Math.min(window.innerWidth - 16, 640);
  const maxHeight = Math.min(window.innerHeight * 0.55, 640);

  const gameW = COLS * BASE_CELL;
  const gameH = ROWS * BASE_CELL;

  scaleFactor = Math.min(maxWidth / gameW, maxHeight / gameH, 1.0);
  CELL = Math.floor(BASE_CELL * scaleFactor);

  canvas.width = COLS * CELL;
  canvas.height = ROWS * CELL;
}

resizeCanvas();
window.addEventListener('resize', () => {
  resizeCanvas();
});

window.addEventListener('orientationchange', () => {
  setTimeout(resizeCanvas, 200);
});

// ==================== 游戏引擎 ====================

// 游戏状态
const STATE = {
  MENU: 'menu',
  PLAYING: 'playing',
  PAUSED: 'paused',
  GAMEOVER: 'gameover'
};

let gameState = STATE.MENU;
let score = 0;
let level = 1;
let lives = 3;
let kills = 0;
let enemiesRemaining = 0;
let enemiesOnScreen = 0;
let maxEnemiesOnScreen = 4;
let enemySpawnTimer = 0;
let enemySpawnDelay = 90;
let baseEnemySpeed = 1.0;
let animationId = null;

// 输入处理 - 键盘 + 触屏虚拟按键
const keys = {};
const touchKeys = {}; // 触屏模拟的按键

function isKeyDown(key) {
  return !!(keys[key] || touchKeys[key]);
}

window.addEventListener('keydown', e => {
  keys[e.key] = true;
  keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key) ||
      ['Space'].includes(e.code)) {
    e.preventDefault();
  }
});

window.addEventListener('keyup', e => {
  keys[e.key] = false;
  keys[e.code] = false;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key) ||
      ['Space'].includes(e.code)) {
    e.preventDefault();
  }
});

// ====== 触屏按钮事件 ======
function setupTouchButton(elId, keyName) {
  const el = document.getElementById(elId);
  if (!el) return;

  el.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    touchKeys[keyName] = true;
    el.classList.add('active');
  });

  el.addEventListener('pointerup', (e) => {
    e.preventDefault();
    touchKeys[keyName] = false;
    el.classList.remove('active');
  });

  el.addEventListener('pointerleave', (e) => {
    touchKeys[keyName] = false;
    el.classList.remove('active');
  });

  el.addEventListener('pointercancel', (e) => {
    touchKeys[keyName] = false;
    el.classList.remove('active');
  });

  // 防止双击缩放
  el.addEventListener('touchstart', (e) => {
    e.preventDefault();
    touchKeys[keyName] = true;
    el.classList.add('active');
  });

  el.addEventListener('touchend', (e) => {
    e.preventDefault();
    touchKeys[keyName] = false;
    el.classList.remove('active');
  });
}

setupTouchButton('btnUp', 'ArrowUp');
setupTouchButton('btnDown', 'ArrowDown');
setupTouchButton('btnLeft', 'ArrowLeft');
setupTouchButton('btnRight', 'ArrowRight');
setupTouchButton('btnFire', ' ');

// D-pad 中心按钮和暂停按钮 = 暂停
document.getElementById('btnPause')?.addEventListener('click', () => {

});

});

canvas.addEventListener('touchstart', (e) => e.preventDefault());

// 游戏对象
let mapData = [];
let player = null;
let bullets = [];
let enemies = [];
let particles = [];
let powerUps = [];
let explosions = [];
let spawnPoints = [
  { x: 0, y: 0 },
  { x: COLS - 2, y: 0 },
  { x: COLS - 2, y: ROWS - 2 },
];

// ==================== 类定义 ====================

class Tank {
  constructor(x, y, dir, color, speed, isPlayer = false) {
    this.x = x;
    this.y = y;
    this.dir = dir;
    this.color = color;
    this.speed = speed;
    this.isPlayer = isPlayer;
    this.size = 0.85;
    this.alive = true;
    this.shootCooldown = 0;
    this.shootDelay = isPlayer ? 12 : 45;
    this.moveTimer = 0;
    this.moveDelay = isPlayer ? 0 : 35 + Math.floor(Math.random() * 50);
    this.changeDirTimer = 0;
    this.changeDirDelay = 50 + Math.floor(Math.random() * 100);
    this.flashTimer = 0;
    this.invincible = isPlayer ? 120 : 0;
    this.hp = 1;
    this.type = 'normal';
  }

  update() {
    if (!this.alive) return;

    if (this.shootCooldown > 0) this.shootCooldown--;
    if (this.invincible > 0) this.invincible--;
    if (this.flashTimer > 0) this.flashTimer--;

    if (!this.isPlayer) {
      this.aiUpdate();
    } else {
      this.playerInput();
    }

    if (this.moveTimer <= 0) {
      let moved = this.tryMove(this.dir);
      if (moved) {
        this.moveTimer = this.isPlayer ? 2 : this.moveDelay;
      }
      if (!moved && !this.isPlayer) {
        this.changeDirTimer = 0;
      }
    } else {
      this.moveTimer--;
    }
  }

  playerInput() {
    let newDir = null;
    if (isKeyDown('ArrowUp') || isKeyDown('KeyW')) newDir = DIR.UP;
    else if (isKeyDown('ArrowDown') || isKeyDown('KeyS')) newDir = DIR.DOWN;
    else if (isKeyDown('ArrowLeft') || isKeyDown('KeyA')) newDir = DIR.LEFT;
    else if (isKeyDown('ArrowRight') || isKeyDown('KeyD')) newDir = DIR.RIGHT;

    if (newDir) {
      this.dir = newDir;
      this.moveTimer = 0; // 按住方向键时持续允许移动
    } else {
      this.moveTimer = 1; // 没按键时停止
    }

    if (isKeyDown(' ') || isKeyDown('Space')) {
      this.shoot();
    }
  }

  aiUpdate() {
    this.changeDirTimer--;

    if (this.changeDirTimer <= 0 || Math.random() < 0.012) {
      const dirs = [DIR.UP, DIR.DOWN, DIR.LEFT, DIR.RIGHT];
      if (player && player.alive && Math.random() < 0.4) {
        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const candidates = [];
        if (Math.abs(dx) > Math.abs(dy)) {
          candidates.push(dx > 0 ? DIR.RIGHT : DIR.LEFT);
          candidates.push(dy > 0 ? DIR.DOWN : DIR.UP);
        } else {
          candidates.push(dy > 0 ? DIR.DOWN : DIR.UP);
          candidates.push(dx > 0 ? DIR.RIGHT : DIR.LEFT);
        }
        this.dir = candidates[0];
      } else {
        this.dir = dirs[Math.floor(Math.random() * 4)];
      }
      this.changeDirTimer = this.changeDirDelay;
    }

    if (this.shootCooldown <= 0 && Math.random() < 0.03) {
      this.shoot();
    }
  }

  tryMove(dir) {
    const newX = this.x + dir.x * this.speed * 0.15;
    const newY = this.y + dir.y * this.speed * 0.15;
    return this.canMoveTo(newX, newY, dir);
  }

  canMoveTo(nx, ny, dir) {
    const margin = this.size / 2;
    if (nx - margin < 0 || nx + margin >= COLS ||
        ny - margin < 0 || ny + margin >= ROWS) {
      return false;
    }

    const corners = [
      { x: nx - margin + 0.1, y: ny - margin + 0.1 },
      { x: nx + margin - 0.1, y: ny - margin + 0.1 },
      { x: nx - margin + 0.1, y: ny + margin - 0.1 },
      { x: nx + margin - 0.1, y: ny + margin - 0.1 },
    ];

    for (const corner of corners) {
      const cx = Math.floor(corner.x);
      const cy = Math.floor(corner.y);
      if (cx < 0 || cx >= COLS || cy < 0 || cy >= ROWS) return false;
      const tile = mapData[cy * COLS + cx];
      if (tile === 1 || tile === 2 || tile === 3) return false;
    }

    const allTanks = this.isPlayer ? enemies : [player, ...enemies.filter(e => e !== this && e.alive)];
    for (const tank of allTanks) {
      if (!tank || !tank.alive || tank === this) continue;
      const dx = nx - tank.x;
      const dy = ny - tank.y;
      const minDist = this.size * 0.8;
      if (Math.abs(dx) < minDist && Math.abs(dy) < minDist) {
        return false;
      }
    }

    return true;
  }

  shoot() {
    if (this.shootCooldown > 0) return;
    this.shootCooldown = this.shootDelay;
    const bx = this.x + this.dir.x * 0.5;
    const by = this.y + this.dir.y * 0.5;
    bullets.push(new Bullet(bx, by, this.dir, this.isPlayer));
  }

  hit() {
    this.hp--;
    if (this.hp <= 0) {
      this.alive = false;
      this.onDestroy();
    } else {
      this.flashTimer = 20;
    }
  }

  onDestroy() {
    for (let i = 0; i < 12; i++) {
      particles.push(new Particle(
        this.x * BASE_CELL, this.y * BASE_CELL,
        (Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4,
        this.color,
        20 + Math.random() * 20
      ));
    }

    if (!this.isPlayer) {
      kills++;
      score += this.type === 'fast' ? 300 : this.type === 'armored' ? 500 : 100;
      enemiesOnScreen--;
      enemiesRemaining--;
      if (Math.random() < 0.15) {
        powerUps.push(new PowerUp(this.x, this.y));
      }
    }

    updateUI();
  }

  draw(ctx) {
    if (!this.alive) return;
    if (this.invincible > 0 && Math.floor(this.invincible / 4) % 2 === 0) return;
    if (this.flashTimer > 0 && Math.floor(this.flashTimer / 3) % 2 === 0) return;

    const cx = this.x * CELL;
    const cy = this.y * CELL;
    const half = (this.size * CELL) / 2;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(this.dir.angle);

    // 主体
    ctx.fillStyle = this.color;
    ctx.fillRect(-half, -half * 0.85, half * 2, half * 1.7);

    // 履带
    ctx.fillStyle = '#1a1a1a';
    const trackW = Math.max(3, CELL * 0.2);
    ctx.fillRect(-half - 2, -half * 0.85, trackW, half * 1.7);
    ctx.fillRect(half - trackW + 2, -half * 0.85, trackW, half * 1.7);

    // 履带纹理
    ctx.fillStyle = '#333';
    for (let i = -half * 0.7; i < half * 0.7; i += Math.max(4, CELL * 0.2)) {
      ctx.fillRect(-half - 2, i, trackW, 2);
      ctx.fillRect(half - trackW + 2, i, trackW, 2);
    }

    // 炮塔
    const turretColor = this.isPlayer ? '#4ecdc4' : '#ffd93d';
    ctx.fillStyle = turretColor;
    ctx.beginPath();
    ctx.arc(0, 0, half * 0.55, 0, Math.PI * 2);
    ctx.fill();

    // 炮管
    ctx.fillStyle = turretColor;
    const barrelW = Math.max(2, CELL * 0.2);
    ctx.fillRect(-barrelW/2, -half * 0.85, barrelW, half * 1.1);

    // 炮管尖端
    ctx.fillStyle = '#fff';
    ctx.fillRect(-1, -half * 0.85 - 2, 3, Math.max(3, CELL * 0.18));

    ctx.restore();
  }
}

class Bullet {
  constructor(x, y, dir, isPlayer) {
    this.x = x;
    this.y = y;
    this.dir = dir;
    this.isPlayer = isPlayer;
    this.speed = 0.22;
    this.alive = true;
    this.size = Math.max(2, CELL * 0.12);
  }

  update() {
    this.x += this.dir.x * this.speed;
    this.y += this.dir.y * this.speed;

    if (this.x < 0 || this.x >= COLS || this.y < 0 || this.y >= ROWS) {
      this.alive = false;
      this.spark();
      return;
    }

    const cx = Math.floor(this.x);
    const cy = Math.floor(this.y);
    if (cx >= 0 && cx < COLS && cy >= 0 && cy < ROWS) {
      const tile = mapData[cy * COLS + cx];
      if (tile === 1) {
        mapData[cy * COLS + cx] = 0;
        for (let i = 0; i < 5; i++) {
          particles.push(new Particle(
            cx * BASE_CELL + BASE_CELL/2, cy * BASE_CELL + BASE_CELL/2,
            (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2,
            '#c4934a', 15 + Math.random() * 10
          ));
        }
        this.alive = false;
        return;
      }
      if (tile === 2) {
        this.alive = false;
        this.spark();
        return;
      }
    }

    const targets = this.isPlayer ? enemies : (player && player.alive ? [player] : []);
    for (const tank of targets) {
      if (!tank || !tank.alive) continue;
      const dx = this.x - tank.x;
      const dy = this.y - tank.y;
      if (Math.abs(dx) < tank.size * 0.5 && Math.abs(dy) < tank.size * 0.5) {
        tank.hit();
        this.alive = false;
        return;
      }
    }

    if (this.isPlayer) {
      for (const bullet of bullets) {
        if (bullet === this || !bullet.alive || bullet.isPlayer) continue;
        const dx = this.x - bullet.x;
        const dy = this.y - bullet.y;
        if (Math.abs(dx) < 0.25 && Math.abs(dy) < 0.25) {
          this.alive = false;
          bullet.alive = false;
          return;
        }
      }
    }
  }

  spark() {
    for (let i = 0; i < 4; i++) {
      particles.push(new Particle(
        this.x * BASE_CELL, this.y * BASE_CELL,
        (Math.random() - 0.5) * 3, (Math.random() - 0.5) * 3,
        '#ffd93d', 8 + Math.random() * 8
      ));
    }
  }

  draw(ctx) {
    if (!this.alive) return;
    ctx.fillStyle = this.isPlayer ? '#fff' : '#ff6b6b';
    ctx.shadowColor = this.isPlayer ? '#4ecdc4' : '#ff4444';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(this.x * CELL, this.y * CELL, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

class Particle {
  constructor(x, y, vx, vy, color, life) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.color = color;
    this.life = life;
    this.maxLife = life;
    this.size = 1 + Math.random() * 2;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
    this.vx *= 0.95;
    this.vy *= 0.95;
  }

  draw(ctx) {
    if (this.life <= 0) return;
    const alpha = this.life / this.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.color;
    const s = this.size * scaleFactor;
    const px = this.x * scaleFactor;
    const py = this.y * scaleFactor;
    ctx.fillRect(px - s/2, py - s/2, s, s);
    ctx.globalAlpha = 1;
  }
}

class PowerUp {
  constructor(x, y) {
    this.x = Math.floor(x);
    this.y = Math.floor(y);
    this.type = Math.random() < 0.5 ? 'speed' : 'shield';
    this.alive = true;
    this.timer = 600;
    this.blink = 0;
  }

  update() {
    this.timer--;
    this.blink++;
    if (this.timer <= 0) this.alive = false;

    if (player && player.alive && this.alive) {
      const dx = player.x - (this.x + 0.5);
      const dy = player.y - (this.y + 0.5);
      if (Math.abs(dx) < 0.7 && Math.abs(dy) < 0.7) {
        this.apply();
        this.alive = false;
      }
    }
  }

  apply() {
    if (this.type === 'speed') {
      player.speed = Math.min(player.speed + 0.3, 2.5);
      setTimeout(() => { if (player) player.speed = 1.2; }, 10000);
    } else {
      player.invincible = 300;
    }
    score += 200;
    updateUI();
  }

  draw(ctx) {
    if (!this.alive) return;
    if (this.blink % 30 < 15) return;

    const cx = (this.x + 0.5) * CELL;
    const cy = (this.y + 0.5) * CELL;

    ctx.fillStyle = this.type === 'speed' ? '#4ecdc4' : '#ffd93d';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(cx, cy, CELL * 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#000';
    const fs = Math.max(10, CELL * 0.5);
    ctx.font = `${fs}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.type === 'speed' ? '⚡' : '\u{1F6E1}️', cx, cy);
  }
}

// ==================== 游戏逻辑 ====================

function getMapTemplate(lvl) {
  return MAP_TEMPLATES[(lvl - 1) % MAP_TEMPLATES.length];
}

function loadLevel(lvl) {
  mapData = [...getMapTemplate(lvl)];
  bullets = [];
  enemies = [];
  particles = [];
  powerUps = [];
  explosions = [];

  player = new Tank(12.5, 24, DIR.UP, '#2ecc71', 1.2, true);
  player.invincible = 120;

  enemiesRemaining = 10 + lvl * 2;
  enemiesOnScreen = 0;
  maxEnemiesOnScreen = Math.min(4 + lvl, 8);
  enemySpawnDelay = Math.max(30, 90 - lvl * 5);
  baseEnemySpeed = 0.7 + lvl * 0.1;
  enemySpawnTimer = 60;

  updateUI();
}

function spawnEnemy() {
  if (enemiesOnScreen >= maxEnemiesOnScreen || enemiesRemaining <= 0) return false;

  const sp = spawnPoints[Math.floor(Math.random() * spawnPoints.length)];
  const types = ['normal', 'normal', 'normal', 'fast', 'armored'];
  const type = level >= 2 ? types[Math.floor(Math.random() * types.length)] : 'normal';

  let color, speed, hp;
  switch (type) {
    case 'fast':
      color = '#f39c12'; speed = baseEnemySpeed * 1.6; hp = 1; break;
    case 'armored':
      color = '#e74c3c'; speed = baseEnemySpeed * 0.7; hp = 2; break;
    default:
      color = '#c0392b'; speed = baseEnemySpeed; hp = 1; break;
  }

  const enemy = new Tank(sp.x + 1, sp.y + 1, DIR.DOWN, color, speed, false);
  enemy.hp = hp;
  enemy.type = type;
  enemy.invincible = 40;

  if (!enemy.canMoveTo(enemy.x, enemy.y, enemy.dir)) {
    return false;
  }

  enemies.push(enemy);
  enemiesOnScreen++;
  return true;
}

function update() {
  if (gameState !== STATE.PLAYING) return;

  if (enemiesRemaining <= 0 && enemies.length === 0) {
    levelUp();
    return;
  }

  enemySpawnTimer--;
  if (enemySpawnTimer <= 0 && enemiesRemaining > 0) {
    spawnEnemy();
    enemySpawnTimer = enemySpawnDelay + Math.floor(Math.random() * 30);
  }

  if (player && player.alive) {
    player.update();
  } else if (player && !player.alive && lives > 0) {
    if (explosions.length === 0) {
      lives--;
      updateUI();
      if (lives <= 0) {
        gameOver(false);
      } else {
        respawnPlayer();
      }
    }
  }

  for (const enemy of enemies) {
    if (enemy.alive) enemy.update();
  }

  for (const bullet of bullets) {
    if (bullet.alive) bullet.update();
  }

  for (const p of particles) {
    p.update();
  }

  for (const pu of powerUps) {
    if (pu.alive) pu.update();
  }

  bullets = bullets.filter(b => b.alive);
  enemies = enemies.filter(e => e.alive);
  particles = particles.filter(p => p.life > 0);
  powerUps = powerUps.filter(p => p.alive);

  if (player && !player.alive && explosions.length === 0 && lives > 0) {
    respawnPlayer();
  }
}

function respawnPlayer() {
  player = new Tank(12.5, 24, DIR.UP, '#2ecc71', 1.2, true);
  player.invincible = 120;
  updateUI();
}

function levelUp() {
  level++;
  score += 500;
  updateUI();
  gameState = STATE.PAUSED;
  setTimeout(() => {
    if (gameState === STATE.PAUSED) {
      loadLevel(level);
      gameState = STATE.PLAYING;
    }
  }, 2000);
}

function gameOver(won) {
  gameState = STATE.GAMEOVER;
  document.getElementById('gameOverTitle').textContent = won ? '🏆 恭喜通关!' : '💥 游戏结束';
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalKills').textContent = kills;
  document.getElementById('finalLevel').textContent = level;
  document.getElementById('gameOverOverlay').classList.remove('hidden');
}

function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('level').textContent = level;
  document.getElementById('lives').textContent = Math.max(0, lives);
  document.getElementById('kills').textContent = kills;
}

function resetGame() {
  score = 0;
  level = 1;
  lives = 3;
  kills = 0;
  enemiesRemaining = 0;
  enemiesOnScreen = 0;
  maxEnemiesOnScreen = 4;
  enemySpawnTimer = 0;
  enemySpawnDelay = 90;
  baseEnemySpeed = 1.0;
  updateUI();
}

// ==================== 渲染 ====================

function render() {
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 地图
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const tile = mapData[y * COLS + x];
      if (tile === 4) continue;
      const px = x * CELL;
      const py = y * CELL;

      switch (tile) {
        case 1: // 砖墙
          ctx.fillStyle = '#c4934a';
          ctx.fillRect(px, py, CELL, CELL);
          ctx.strokeStyle = '#8b5e2b';
          ctx.lineWidth = 1;
          ctx.strokeRect(px + 0.5, py + 0.5, CELL - 1, CELL - 1);
          ctx.fillStyle = '#a07030';
          ctx.fillRect(px + CELL*0.15, py + CELL*0.15, CELL*0.35, CELL*0.35);
          ctx.fillRect(px + CELL*0.5, py + CELL*0.5, CELL*0.35, CELL*0.35);
          break;
        case 2: // 钢墙
          ctx.fillStyle = '#7f8c8d';
          ctx.fillRect(px, py, CELL, CELL);
          ctx.fillStyle = '#95a5a6';
          ctx.fillRect(px + 2, py + 2, CELL - 4, CELL - 4);
          [[3,3],[CELL-7,3],[3,CELL-7],[CELL-7,CELL-7]].forEach(([rx, ry]) => {
            ctx.fillStyle = '#555';
            ctx.beginPath();
            ctx.arc(px + rx + 2, py + ry + 2, Math.max(1.5, CELL*0.08), 0, Math.PI*2);
            ctx.fill();
          });
          break;
        case 3: // 水
          ctx.fillStyle = '#2471a3';
          ctx.fillRect(px, py, CELL, CELL);
          break;
        default:
          if ((x + y) % 2 === 0 && CELL > 6) {
            ctx.fillStyle = '#111';
            ctx.fillRect(px, py, CELL, CELL);
          }
          break;
      }
    }
  }

  // 道具
  for (const pu of powerUps) pu.draw(ctx);

  // 坦克
  for (const enemy of enemies) enemy.draw(ctx);
  if (player && player.alive) player.draw(ctx);

  // 子弹
  for (const bullet of bullets) bullet.draw(ctx);

  // 粒子
  for (const p of particles) p.draw(ctx);

  // 草丛 (覆盖层)
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const tile = mapData[y * COLS + x];
      if (tile === 4) {
        const px = x * CELL;
        const py = y * CELL;
        ctx.fillStyle = '#1e8449';
        ctx.fillRect(px, py, CELL, CELL);
        ctx.fillStyle = '#27ae60';
        for (let i = 0; i < 6; i++) {
          const gx = px + (i * 11 + x * 5) % CELL;
          const gy = py + (i * 7 + y * 3) % CELL;
          ctx.fillRect(gx, gy, Math.max(2, CELL*0.12), Math.max(4, CELL*0.2));
        }
      }
    }
  }

  // 关卡提示
  if (gameState === STATE.PAUSED && level > 1 && enemiesRemaining > 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, canvas.height/2 - Math.max(20, CELL*1.2), canvas.width, Math.max(40, CELL*2.4));
    ctx.fillStyle = '#e94560';
    const fs = Math.max(16, CELL);
    ctx.font = `bold ${fs}px "Microsoft YaHei", Arial`;
    ctx.textAlign = 'center';
    ctx.fillText(`🏆 第 ${level} 关`, canvas.width/2, canvas.height/2 + 8);
  }

  // 敌人剩余指示
  for (let i = 0; i < Math.min(enemiesRemaining, 20); i++) {
    const row = Math.floor(i / 2);
    const col = i % 2;
    const is = Math.max(3, CELL * 0.25);
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(
      COLS * CELL - (is + 2) * 3 + col * (is + 2),
      6 + row * (is + 2),
      is, is
    );
  }
}

// ==================== 游戏循环 ====================

function gameLoop() {
  update();
  render();
  animationId = requestAnimationFrame(gameLoop);
}

// ==================== 事件处理 ====================

window.addEventListener('keydown', function pauseHandler(e) {
  if (e.key === 'p' || e.key === 'P') {
    if (gameState === STATE.PLAYING) pauseGame();
    else if (gameState === STATE.PAUSED) resumeGame();
  }
});

function pauseGame() {
  if (gameState !== STATE.PLAYING) return;
  gameState = STATE.PAUSED;
  document.getElementById('pauseOverlay').classList.remove('hidden');
}

function resumeGame() {
  if (gameState !== STATE.PAUSED) return;
  gameState = STATE.PLAYING;
  document.getElementById('pauseOverlay').classList.add('hidden');
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('resumeBtn').addEventListener('click', resumeGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

function startGame() {
  // 释放所有触屏按键
  for (const k in touchKeys) touchKeys[k] = false;
  for (const k in keys) keys[k] = false;
  document.querySelectorAll('.active').forEach(el => el.classList.remove('active'));

  resetGame();
  document.getElementById('startOverlay').classList.add('hidden');
  document.getElementById('pauseOverlay').classList.add('hidden');
  document.getElementById('gameOverOverlay').classList.add('hidden');
  gameState = STATE.PLAYING;
  resizeCanvas();
  loadLevel(level);
}

// 初始加载
loadLevel(1);
gameState = STATE.MENU;
gameLoop();

console.log('🎮 坦克大战已就绪!');
console.log('桌面: 方向键移动 + 空格射击 | 手机: 虚拟摇杆 + 开火按钮');
</script>

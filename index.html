// ==================== 类定义 ====================

class Tank {
  constructor(x, y, dir, color, speed, isPlayer = false) {
    this.x = x;
    this.y = y;
    this.dir = dir;           // 车身朝向（移动方向）
    this.turretDir = dir;     // 炮塔朝向（射击方向），玩家可独立控制
    this.color = color;
    this.speed = speed;
    this.isPlayer = isPlayer;
    this.size = 0.85;
    this.alive = true;
    this.shootCooldown = 0;
    this.shootDelay = isPlayer ? 12 : 70;
    this.moveTimer = 0;
    this.moveDelay = isPlayer ? 0 : 35 + Math.floor(Math.random() * 50);
    this.changeDirTimer = 0;
    this.changeDirDelay = 45 + Math.floor(Math.random() * 80);
    this.targetDir = dir;     // AI 目标移动方向
    this.flashTimer = 0;
    this.invincible = isPlayer ? 120 : 0;
    this.hp = 1;
    this.type = 'normal';
  }

  update() {
    if (!this.alive) return;

    if (this.shootCooldown > 0) this.shootCooldown--;
    if (this.invincible > 0) this.invincible--;
    if (this.flashTimer > 0) this.flashTimer--;

    if (!this.isPlayer) {
      this.aiUpdate();
      // AI 连续自由移动
      this.aiMove();
    } else {
      this.playerInput(); // 玩家在 playerInput 中直接移动
    }
  }

  playerInput() {
    // ===== 冲刺处理 =====
    if (dashState && dashState.timer > 0) {
      dashState.timer--;
      // 冲刺移动（高速）
      const dashSpd = dashState.mythic ? 0.45 : 0.3; // 神话1.5倍
      const nx = this.x + dashState.dir.x * dashSpd;
      const ny = this.y + dashState.dir.y * dashSpd;
      if (this.canMoveTo(nx, ny, dashState.dir)) {
        this.x = nx;
        this.y = ny;
        this.dir = dashState.dir;
      }
      // 冲刺全程无敌 + 结束后30帧缓冲
      this.invincible = dashState.timer + 30;
      // 冲刺粒子
      if (Math.random() < 0.6) {
        particles.push(new Particle(
          this.x * BASE_CELL, this.y * BASE_CELL,
          -dashState.dir.x * 2 + (Math.random()-0.5)*2,
          -dashState.dir.y * 2 + (Math.random()-0.5)*2,
          dashState.mythic ? '#ffd700' : '#4ecdc4', 8 + Math.random() * 8
        ));
      }
      // 结束冲刺
      if (dashState.timer <= 0) {
        dashState = null;
      }
      // 冲刺期间仍可射击
      if (isKeyDown('j') || isKeyDown('KeyJ')) {
        this.shoot();
      }
      return;
    }

    // ===== 移动输入：WASD（桌面）或左摇杆（手机） =====
    let moveDx = 0, moveDy = 0;
    if (moveJoy.active) {
      moveDx = moveJoy.dx;
      moveDy = moveJoy.dy;
    } else {
      if (isKeyDown('KeyW')) moveDy = -1;
      if (isKeyDown('KeyS')) moveDy = 1;
      if (isKeyDown('KeyA')) moveDx = -1;
      if (isKeyDown('KeyD')) moveDx = 1;
    }

    if (moveDx !== 0 || moveDy !== 0) {
      // 更新车身朝向（优先水平方向）
      if (moveDx !== 0) this.dir = moveDx > 0 ? DIR.RIGHT : DIR.LEFT;
      else if (moveDy !== 0) this.dir = moveDy > 0 ? DIR.DOWN : DIR.UP;

      // 移动车身（普通半速，神话1.5倍速）
      const spd = this.speed * (mythicMode ? 0.052 : 0.018);
      const nx = this.x + moveDx * spd;
      const ny = this.y + moveDy * spd;

      if (moveDx !== 0 && moveDy !== 0) {
        if (this.canMoveTo(nx, this.y, this.dir)) this.x = nx;
        if (this.canMoveTo(this.x, ny, this.dir)) this.y = ny;
      } else if (moveDx !== 0) {
        if (this.canMoveTo(nx, this.y, this.dir)) this.x = nx;
      } else if (moveDy !== 0) {
        if (this.canMoveTo(this.x, ny, this.dir)) this.y = ny;
      }

      // 无摇杆输入时炮塔跟随移动方向
      if (!aimJoy.active && !mouseOnCanvas) {
        this.turretDir = this.dir;
      }
    }

    // 炮塔跟随鼠标（桌面）或右摇杆（手机）或移动方向
    if (aimJoy.active) {
      const angle = Math.atan2(aimJoy.dy, aimJoy.dx);
      this.turretDir = { x: Math.cos(angle), y: Math.sin(angle), angle };
      // 右摇杆拖动时自动射击
      this.shoot();
    } else if (mouseOnCanvas && !isTouchDevice) {
      const angle = Math.atan2(mouseY - this.y, mouseX - this.x);
      this.turretDir = { x: Math.cos(angle), y: Math.sin(angle), angle };
    } else if (moveDx !== 0 || moveDy !== 0) {
      this.turretDir = this.dir;
    }

    // ===== 射击（J键，手机右摇杆自动射击） =====
    if (isKeyDown('j') || isKeyDown('KeyJ')) {
      this.shoot();
    }
  }

  aiUpdate() {
    this.changeDirTimer--;

    // 炮塔始终锁定玩家
    if (player && player.alive) {
      const pdx = player.x - this.x;
      const pdy = player.y - this.y;
      if (Math.abs(pdx) > Math.abs(pdy)) {
        this.turretDir = pdx > 0 ? DIR.RIGHT : DIR.LEFT;
      } else {
        this.turretDir = pdy > 0 ? DIR.DOWN : DIR.UP;
      }
    }

    // 定时或随机更新移动目标方向
    if (this.changeDirTimer <= 0 || Math.random() < 0.008) {
      // Boss 始终追击玩家
      const pursueChance = this.type === 'boss' ? 0.9 : 0.55;
      if (player && player.alive && Math.random() < pursueChance) {
        // 朝向玩家移动
        const dx = player.x - this.x;
        const dy = player.y - this.y;
        if (Math.abs(dx) > Math.abs(dy)) {
          this.targetDir = dx > 0 ? DIR.RIGHT : DIR.LEFT;
        } else {
          this.targetDir = dy > 0 ? DIR.DOWN : DIR.UP;
        }
      } else {
        // 随机方向
        const dirs = [DIR.UP, DIR.DOWN, DIR.LEFT, DIR.RIGHT];
        const reverse = { x: -this.dir.x, y: -this.dir.y };
        const filtered = dirs.filter(d => !(d.x === reverse.x && d.y === reverse.y));
        this.targetDir = filtered[Math.floor(Math.random() * filtered.length)];
      }
      this.changeDirTimer = this.changeDirDelay;
    }

    // 射击：Boss特殊模式，普通敌人锁定玩家
    if (this.type === 'boss') {
      if (this.shootCooldown <= 0 && Math.random() < 0.05) {
        this.bossShoot();
      }
    } else if (this.shootCooldown <= 0 && Math.random() < 0.025) {
      this.shoot();
    }
  }

  aiMove() {
    if (!this.targetDir) this.targetDir = this.dir;

    // Boss全速，小兵半速
    const spd = this.speed * (this.type === 'boss' ? 0.035 : 0.018);
    // 先尝试朝目标方向移动
    const tx = this.x + this.targetDir.x * spd;
    const ty = this.y + this.targetDir.y * spd;

    if (this.canMoveTo(tx, ty, this.targetDir)) {
      this.dir = this.targetDir;
      this.x = tx;
      this.y = ty;
    } else if (this.canMoveTo(this.x + this.dir.x * spd, this.y + this.dir.y * spd, this.dir)) {
      // 目标方向被挡，继续当前方向
      this.x += this.dir.x * spd;
      this.y += this.dir.y * spd;
    } else {
      // 当前方向也被挡，尝试垂直方向
      const alts = this.dir.x === 0
        ? [DIR.LEFT, DIR.RIGHT]
        : [DIR.UP, DIR.DOWN];
      let moved = false;
      for (const alt of alts) {
        const ax = this.x + alt.x * spd;
        const ay = this.y + alt.y * spd;
        if (this.canMoveTo(ax, ay, alt)) {
          this.dir = alt;
          this.x = ax;
          this.y = ay;
          moved = true;
          break;
        }
      }
      // 还是不行，尝试后退
      if (!moved) {
        const reverse = { x: -this.dir.x, y: -this.dir.y, angle: this.dir.angle + Math.PI };
        const rx = this.x + reverse.x * spd;
        const ry = this.y + reverse.y * spd;
        if (this.canMoveTo(rx, ry, reverse)) {
          this.dir = reverse;
          this.x = rx;
          this.y = ry;
        }
      }
    }
  }

  canMoveTo(nx, ny, dir) {
    const margin = this.size / 2;
    if (nx - margin < 0 || nx + margin >= COLS ||
        ny - margin < 0 || ny + margin >= ROWS) {
      return false;
    }

    const corners = [
      { x: nx - margin + 0.1, y: ny - margin + 0.1 },
      { x: nx + margin - 0.1, y: ny - margin + 0.1 },
      { x: nx - margin + 0.1, y: ny + margin - 0.1 },
      { x: nx + margin - 0.1, y: ny + margin - 0.1 },
    ];

    for (const corner of corners) {
      const cx = Math.floor(corner.x);
      const cy = Math.floor(corner.y);
      if (cx < 0 || cx >= COLS || cy < 0 || cy >= ROWS) return false;
      const tile = mapData[cy * COLS + cx];
      if (tile === 1 || tile === 2 || tile === 3) return false;
    }

    const allTanks = this.isPlayer ? enemies : [player, ...enemies.filter(e => e !== this && e.alive)];
    for (const tank of allTanks) {
      if (!tank || !tank.alive || tank === this) continue;
      const dx = nx - tank.x;
      const dy = ny - tank.y;
      const minDist = this.size * 0.8;
      if (Math.abs(dx) < minDist && Math.abs(dy) < minDist) {
        return false;
      }
    }

    return true;
  }

  shoot() {
    if (this.shootCooldown > 0) return;
    this.shootCooldown = this.isPlayer && mythicMode ? 8 : this.shootDelay;

    if (this.isPlayer && mythicMode) {
      // 追踪攻击次数
      if (!this._mythicAttacks) this._mythicAttacks = 0;
      this._mythicAttacks++;

      // 每20次攻击：6枚核弹
      if (this._mythicAttacks % 20 === 0) {
        for (let n = 0; n < 6; n++) {
          const nx = 3 + Math.random() * (COLS - 6);
          const ny = 3 + Math.random() * (ROWS - 6);
          nukes.push({
            x: nx, y: ny,
            timer: 90,
            maxTimer: 90,
            radius: 4,
            isPlayerNuke: true  // 不伤玩家
          });
        }
        this.shootCooldown = 20;
      } else if (this._mythicAttacks % 5 === 0) {
        // 每5次攻击：4发追踪导弹
        for (let m = 0; m < 4; m++) {
          const a = (Math.PI * 2 / 4) * m + Math.random() * 0.5;
          const dir = { x: Math.cos(a), y: Math.sin(a), angle: a };
          const bx = this.x + dir.x * 0.7;
          const by = this.y + dir.y * 0.7;
          const missile = new Bullet(bx, by, dir, true, true, 999);
          missile.isMissile = true;
          missile.speed = 0.06;
          missile.size = Math.max(4, CELL * 0.2);
          bullets.push(missile);
        }
        this.shootCooldown = 14;
      } else {
        // 神话模式：360度环形发射
        const count = 16;
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 / count) * i;
          const dir = { x: Math.cos(angle), y: Math.sin(angle), angle: angle };
          const bx = this.x + dir.x * 0.5;
          const by = this.y + dir.y * 0.5;
          bullets.push(new Bullet(bx, by, dir, true, true));
        }
      }
    } else {
      // 普通射击
      const shootDir = this.isPlayer ? this.turretDir : this.dir;
      const bx = this.x + shootDir.x * 0.5;
      const by = this.y + shootDir.y * 0.5;
      bullets.push(new Bullet(bx, by, shootDir, this.isPlayer));
    }
  }

  // Boss 专属：扇形散射 + 每3次攻击发射导弹
  bossShoot() {
    if (this.shootCooldown > 0) return;
    this.shootCooldown = this.shootDelay;

    // 追踪攻击次数
    if (!this._attackCount) this._attackCount = 0;
    this._attackCount++;

    const isDemon = this._isDemonKing;
    const isPhase2 = bossPhase === 2;
    const count = isDemon ? 7 : (isPhase2 ? 5 : 3);
    const spread = isDemon ? 0.15 : (isPhase2 ? 0.2 : 0.3);
    const baseDir = this.turretDir;

    // 每第4次攻击：核弹预警
    if (this._attackCount % 4 === 0) {
      const nukeCount = isPhase2 ? 6 : 4;
      const nukePositions = []; // 跟踪位置用于限制重叠
      for (let n = 0; n < nukeCount; n++) {
        let nx, ny, overlaps;
        // 最多重试10次找不重叠位置
        for (let attempt = 0; attempt < 10; attempt++) {
          nx = 3 + Math.random() * (COLS - 6);
          ny = 3 + Math.random() * (ROWS - 6);
          // 检查与已有核弹的重叠数
          overlaps = nukePositions.filter(p =>
            Math.abs(p.x - nx) < 4 && Math.abs(p.y - ny) < 4
          ).length;
          if (overlaps <= 1) break; // 最多与1个重叠（即2个重合）
        }
        nukePositions.push({ x: nx, y: ny });
        nukes.push({
          x: nx, y: ny,
          timer: 120,
          maxTimer: 120,
          radius: isPhase2 ? 5 : 4,
          warningRadius: isPhase2 ? 5 : 4
        });
      }
      this.shootCooldown = this.shootDelay * 2; // 核弹攻击冷却更长
    } else if (this._attackCount % 3 === 0) {
      // 每第3次攻击：发射追踪导弹
      const pdx = player.x - this.x;
      const pdy = player.y - this.y;
      const pAngle = Math.atan2(pdy, pdx);
      const pDir = { x: Math.cos(pAngle), y: Math.sin(pAngle), angle: pAngle };
      const mbx = this.x + pDir.x * 0.7;
      const mby = this.y + pDir.y * 0.7;
      const missile = new Bullet(mbx, mby, pDir, false, true, 999);
      missile.isMissile = true;
      missile.speed = 0.038;
      missile.size = Math.max(4, CELL * 0.22);
      bullets.push(missile);

      // 3发随机位置导弹
      for (let m = 0; m < 3; m++) {
        const rAngle = Math.random() * Math.PI * 2;
        const rDir = { x: Math.cos(rAngle), y: Math.sin(rAngle), angle: rAngle };
        const rbx = this.x + rDir.x * 0.7;
        const rby = this.y + rDir.y * 0.7;
        const rMissile = new Bullet(rbx, rby, rDir, false, false, 999);
        rMissile.isMissile = true;
        rMissile.speed = 0.03;
        rMissile.size = Math.max(4, CELL * 0.2);
        bullets.push(rMissile);
      }
    } else {
      // 普通扇形散射
      for (let i = 0; i < count; i++) {
        const offset = (i - (count - 1) / 2) * spread;
        const angle = baseDir.angle + offset;
        const dir = { x: Math.cos(angle), y: Math.sin(angle), angle: angle };
        const bx = this.x + dir.x * 0.5;
        const by = this.y + dir.y * 0.5;
        bullets.push(new Bullet(bx, by, dir, false, false, 2));
      }
    }
  }

  hit() {
    // 无敌时不受伤
    if (this.invincible > 0) return;
    this.hp--;
    if (this.hp <= 0) {
      this.alive = false;
      this.onDestroy();
    } else {
      this.flashTimer = 20;
      // 玩家受伤重置神话模式
      if (this.isPlayer) {
        killStreak = 0;
        mythicMode = false;
        player._mythicAttacks = 0;
      }
    }
  }

  onDestroy() {
    for (let i = 0; i < 12; i++) {
      particles.push(new Particle(
        this.x * BASE_CELL, this.y * BASE_CELL,
        (Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4,
        this.color,
        20 + Math.random() * 20
      ));
    }

    if (!this.isPlayer) {
      kills++;
      killStreak++;
      const isBoss = this.type === 'boss';
      score += isBoss ? 2000 + level * 500
             : this.type === 'fast' ? 300
             : this.type === 'armored' ? 500 : 100;
      enemiesOnScreen--;
      if (!isBoss) enemiesRemaining--;
      // Boss掉落必定道具
      if (isBoss || Math.random() < 0.15) {
        powerUps.push(new PowerUp(this.x, this.y));
        if (isBoss) powerUps.push(new PowerUp(this.x + 0.5, this.y));
      }
      // Boss爆炸更大
      if (isBoss) {
        for (let i = 0; i < 30; i++) {
          particles.push(new Particle(
            this.x * BASE_CELL, this.y * BASE_CELL,
            (Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8,
            Math.random() < 0.5 ? '#8b00ff' : '#ff00ff',
            30 + Math.random() * 40
          ));
        }
      }
      // 连续击杀3个进入神话模式
      if (killStreak >= 3 && !mythicMode) {
        mythicMode = true;
        player.invincible = 90;
      }
    }

    updateUI();
  }

  draw(ctx) {
    if (!this.alive) return;
    if (this.invincible > 0 && Math.floor(this.invincible / 4) % 2 === 0) return;
    if (this.flashTimer > 0 && Math.floor(this.flashTimer / 3) % 2 === 0) return;

    const cx = this.x * CELL;
    const cy = this.y * CELL;
    const half = (this.size * CELL) / 2;
    const isMythic = this.isPlayer && mythicMode;
    const isDashing = this.isPlayer && dashState && dashState.timer > 0;

    // 冲刺：蓝色拖尾（神话金色）
    if (isDashing) {
      const alpha2 = dashState.timer / dashState.maxTimer;
      ctx.save();
      ctx.globalAlpha = alpha2 * 0.5;
      ctx.fillStyle = dashState.mythic ? '#ffd700' : '#4ecdc4';
      for (let t = 1; t <= 3; t++) {
        const tx = cx - dashState.dir.x * CELL * t * 0.8;
        const ty = cy - dashState.dir.y * CELL * t * 0.8;
        ctx.beginPath();
        ctx.arc(tx, ty, half * (1 - t * 0.2), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    // 神话模式：金色光环
    if (isMythic) {
      ctx.save();
      ctx.translate(cx, cy);
      const glowSize = half * 1.6 + Math.sin(Date.now() / 80) * half * 0.2;
      const gradient = ctx.createRadialGradient(0, 0, half * 0.5, 0, 0, glowSize);
      gradient.addColorStop(0, 'rgba(255,215,0,0)');
      gradient.addColorStop(0.5, 'rgba(255,215,0,0.3)');
      gradient.addColorStop(1, 'rgba(255,215,0,0)');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(0, 0, glowSize, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Boss：紫色暗黑光环，魔王：血红光环
    if (this.type === 'boss') {
      ctx.save();
      ctx.translate(cx, cy);
      const isDemon = this._isDemonKing;
      const bglow = half * 1.8 + Math.sin(Date.now() / 100) * half * 0.3;
      const bgrad = ctx.createRadialGradient(0, 0, half * 0.4, 0, 0, bglow);
      if (isDemon) {
        bgrad.addColorStop(0, 'rgba(255,0,0,0)');
        bgrad.addColorStop(0.3, 'rgba(255,0,0,0.45)');
        bgrad.addColorStop(0.6, 'rgba(0,0,0,0.3)');
        bgrad.addColorStop(1, 'rgba(255,0,0,0)');
      } else {
        bgrad.addColorStop(0, 'rgba(139,0,255,0)');
        bgrad.addColorStop(0.4, 'rgba(139,0,255,0.35)');
        bgrad.addColorStop(0.7, 'rgba(200,0,255,0.2)');
        bgrad.addColorStop(1, 'rgba(139,0,255,0)');
      }
      ctx.fillStyle = bgrad;
      ctx.beginPath();
      ctx.arc(0, 0, bglow, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // ---- 车身（按移动方向旋转） ----
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(this.dir.angle);

    // 主体（神话金色/魔王黑红/普通）
    const bodyColor = this._isDemonKing ? '#1a0000' : (isMythic ? '#ffd700' : this.color);
    ctx.fillStyle = bodyColor;
    ctx.fillRect(-half, -half * 0.85, half * 2, half * 1.7);

    // 魔王红色条纹
    if (this._isDemonKing) {
      ctx.fillStyle = '#ff0000';
      ctx.fillRect(-half, -half * 0.85, half * 2, 4);
      ctx.fillRect(-half, half * 0.85 - 4, half * 2, 4);
      ctx.fillRect(-half, -half * 0.3, half * 2, 3);
    }

    // 神话条纹
    if (isMythic) {
      ctx.fillStyle = '#ff6b00';
      ctx.fillRect(-half, -half * 0.85, half * 2, 4);
      ctx.fillRect(-half, half * 0.85 - 4, half * 2, 4);
    }

    // 履带
    ctx.fillStyle = '#1a1a1a';
    const trackW = Math.max(3, CELL * 0.2);
    ctx.fillRect(-half - 2, -half * 0.85, trackW, half * 1.7);
    ctx.fillRect(half - trackW + 2, -half * 0.85, trackW, half * 1.7);

    // 履带纹理
    ctx.fillStyle = isMythic ? '#ffd700' : '#333';
    for (let i = -half * 0.7; i < half * 0.7; i += Math.max(4, CELL * 0.2)) {
      ctx.fillRect(-half - 2, i, trackW, 2);
      ctx.fillRect(half - trackW + 2, i, trackW, 2);
    }

    ctx.restore();

    // ---- 炮塔（按炮塔方向旋转） ----
    ctx.save();
    ctx.translate(cx, cy);
    const turretAngle = this.turretDir.angle;
    ctx.rotate(turretAngle);

    const turretColor = this._isDemonKing ? '#ff0000' : (this.type === 'boss' ? '#cc00ff' : (isMythic ? '#ff6b00' : (this.isPlayer ? '#4ecdc4' : '#ffd93d')));

    // 炮塔底座
    ctx.fillStyle = turretColor;
    ctx.beginPath();
    ctx.arc(0, 0, half * 0.55, 0, Math.PI * 2);
    ctx.fill();

    // 炮管
    ctx.fillStyle = turretColor;
    const barrelW = Math.max(2, CELL * 0.2);
    ctx.fillRect(-barrelW/2, -half * 0.85, barrelW, half * 1.1);

    // 炮管尖端（神话模式亮金色）
    ctx.fillStyle = isMythic ? '#ffd700' : '#fff';
    ctx.fillRect(-1, -half * 0.85 - 2, 3, Math.max(3, CELL * 0.18));

    // Boss 王冠标记
    if (this.type === 'boss') {
      ctx.fillStyle = '#ffd700';
      const crownY = -half * 0.55;
      ctx.beginPath();
      ctx.moveTo(-5, crownY);
      ctx.lineTo(-5, crownY - 5);
      ctx.lineTo(-2, crownY - 3);
      ctx.lineTo(0, crownY - 7);
      ctx.lineTo(2, crownY - 3);
      ctx.lineTo(5, crownY - 5);
      ctx.lineTo(5, crownY);
      ctx.closePath();
      ctx.fill();
    }

    ctx.restore();
  }
}

class Bullet {
  constructor(x, y, dir, isPlayer, homing = false, hp = 1) {
    this.x = x;
    this.y = y;
    this.dir = dir;
    this.isPlayer = isPlayer;
    this.homing = homing;     // 追踪弹
    this.hp = hp;             // 子弹生命值（Boss子弹需多枪抵消）
    this.isMissile = false;   // 是否为Boss导弹（不可抵消+范围爆炸）
    this.speed = isPlayer ? 0.13 : 0.05; // 敌人子弹再减30%
    this.alive = true;
    this.size = Math.max(2, CELL * 0.12);
    this.life = 0;            // 存活帧数
  }

  update() {
    this.life++;

    // 追踪逻辑：寻找范围内最近的敌人
    if (this.homing && this.isPlayer) {
      const HOMING_RANGE = 8; // 追踪范围（格）
      let nearest = null;
      let nearestDist = HOMING_RANGE;
      for (const enemy of enemies) {
        if (!enemy.alive) continue;
        const dx = enemy.x - this.x;
        const dy = enemy.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < nearestDist) {
          nearestDist = dist;
          nearest = enemy;
        }
      }
      if (nearest) {
        // 逐渐转向目标
        const targetAngle = Math.atan2(nearest.y - this.y, nearest.x - this.x);
        let currentAngle = Math.atan2(this.dir.y, this.dir.x);
        let diff = targetAngle - currentAngle;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        const turnRate = 0.08; // 转向速度
        currentAngle += Math.sign(diff) * Math.min(Math.abs(diff), turnRate);
        this.dir = { x: Math.cos(currentAngle), y: Math.sin(currentAngle), angle: currentAngle };
      }
    }

    this.x += this.dir.x * this.speed;
    this.y += this.dir.y * this.speed;

    if (this.x < 0 || this.x >= COLS || this.y < 0 || this.y >= ROWS) {
      this.alive = false;
      this.spark();
      return;
    }

    const cx = Math.floor(this.x);
    const cy = Math.floor(this.y);
    if (cx >= 0 && cx < COLS && cy >= 0 && cy < ROWS) {
      const tile = mapData[cy * COLS + cx];
      if (tile === 1) {
        if (this.isMissile) {
          this.missileExplode(cx, cy); // 导弹范围爆炸
        } else {
          mapData[cy * COLS + cx] = 0;
          for (let i = 0; i < 5; i++) {
            particles.push(new Particle(
              cx * BASE_CELL + BASE_CELL/2, cy * BASE_CELL + BASE_CELL/2,
              (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2,
              '#c4934a', 15 + Math.random() * 10
            ));
          }
        }
        this.alive = false;
        return;
      }
      if (tile === 2) {
        if (this.isMissile) {
          this.missileExplode(cx, cy);
        } else {
          this.spark();
        }
        this.alive = false;
        return;
      }
    }

    const targets = this.isPlayer ? enemies : (player && player.alive ? [player] : []);
    for (const tank of targets) {
      if (!tank || !tank.alive) continue;
      const dx = this.x - tank.x;
      const dy = this.y - tank.y;
      if (Math.abs(dx) < tank.size * 0.5 && Math.abs(dy) < tank.size * 0.5) {
        tank.hit();
        if (this.isMissile) {
          this.missileExplode(Math.floor(this.x), Math.floor(this.y));
        }
        this.alive = false;
        return;
      }
    }

    // 敌人导弹接近玩家时爆炸（玩家导弹不伤自己）
    if (this.isMissile && !this.isPlayer && player && player.alive) {
      const pdx = this.x - player.x;
      const pdy = this.y - player.y;
      const pdist = Math.sqrt(pdx * pdx + pdy * pdy);
      if (pdist < 1.5) {
        player.hit();
        this.missileExplode(Math.floor(this.x), Math.floor(this.y));
        this.alive = false;
        return;
      }
    }

    if (this.isPlayer) {
      for (const bullet of bullets) {
        if (bullet === this || !bullet.alive || bullet.isPlayer) continue;
        const dx = this.x - bullet.x;
        const dy = this.y - bullet.y;
        if (Math.abs(dx) < 0.25 && Math.abs(dy) < 0.25) {
          this.alive = false;         // 玩家子弹消失
          bullet.hp--;                // 敌方子弹扣血
          if (bullet.hp <= 0) {
            bullet.alive = false;     // hp归零才销毁
            bullet.spark();
          }
          return;
        }
      }
    }
  }

  spark() {
    for (let i = 0; i < 4; i++) {
      particles.push(new Particle(
        this.x * BASE_CELL, this.y * BASE_CELL,
        (Math.random() - 0.5) * 3, (Math.random() - 0.5) * 3,
        '#ffd93d', 8 + Math.random() * 8
      ));
    }
  }

  // 导弹范围爆炸
  missileExplode(cx, cy) {
    // 摧毁周围2格砖墙
    for (let dy = -2; dy <= 2; dy++) {
      for (let dx = -2; dx <= 2; dx++) {
        const tx = cx + dx, ty = cy + dy;
        if (tx >= 0 && tx < COLS && ty >= 0 && ty < ROWS) {
          if (mapData[ty * COLS + tx] === 1) {
            mapData[ty * COLS + tx] = 0;
          }
        }
      }
    }
    // 伤害范围内的玩家（玩家自己的导弹不伤自己）
    if (!this.isPlayer && player && player.alive) {
      const pdx = player.x - cx;
      const pdy = player.y - cy;
      if (Math.sqrt(pdx * pdx + pdy * pdy) < 2.5) {
        player.hit();
      }
    }
    // 大爆炸粒子
    for (let i = 0; i < 25; i++) {
      particles.push(new Particle(
        cx * BASE_CELL, cy * BASE_CELL,
        (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6,
        Math.random() < 0.5 ? '#ff4500' : '#ffd700',
        20 + Math.random() * 30
      ));
    }
  }

  draw(ctx) {
    if (!this.alive) return;

    // 导弹特殊外观：玩家绿色/敌人红色脉冲光环
    if (this.isMissile) {
      ctx.save();
      const mx = this.x * CELL, my = this.y * CELL;
      const mpulse = this.size * 1.8 + Math.sin(Date.now() / 60) * this.size * 0.5;
      const mgrad = ctx.createRadialGradient(mx, my, this.size * 0.4, mx, my, mpulse);
      const mcolor = this.isPlayer ? 'rgba(0,150,255,0.6)' : 'rgba(255,50,0,0.6)';
      const mcolor2 = this.isPlayer ? 'rgba(0,150,255,0)' : 'rgba(255,50,0,0)';
      mgrad.addColorStop(0, mcolor);
      mgrad.addColorStop(1, mcolor2);
      ctx.fillStyle = mgrad;
      ctx.beginPath();
      ctx.arc(mx, my, mpulse, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    // 追踪弹金色拖尾
    if (this.homing) {
      const tailLen = 6;
      for (let t = 0; t < tailLen; t++) {
        const alpha = (1 - t / tailLen) * 0.5;
        const tx = this.x - this.dir.x * this.speed * t;
        const ty = this.y - this.dir.y * this.speed * t;
        ctx.fillStyle = `rgba(255, 215, 0, ${alpha})`;
        ctx.beginPath();
        ctx.arc(tx * CELL, ty * CELL, this.size * (1 - t / tailLen), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.fillStyle = this.isMissile ? (this.isPlayer ? '#00aaff' : '#ff4500') : (this.homing ? '#ffd700' : (this.isPlayer ? '#fff' : '#ff6b6b'));
    ctx.shadowColor = this.isMissile ? (this.isPlayer ? '#0088ff' : '#ff0000') : (this.homing ? '#ff8c00' : (this.isPlayer ? '#4ecdc4' : '#ff4444'));
    ctx.shadowBlur = this.isMissile ? 14 : (this.homing ? 10 : 6);
    ctx.beginPath();
    ctx.arc(this.x * CELL, this.y * CELL, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

class Particle {
  constructor(x, y, vx, vy, color, life) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.color = color;
    this.life = life;
    this.maxLife = life;
    this.size = 1 + Math.random() * 2;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
    this.vx *= 0.95;
    this.vy *= 0.95;
  }

  draw(ctx) {
    if (this.life <= 0) return;
    const alpha = this.life / this.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.color;
    const s = this.size * scaleFactor;
    const px = this.x * scaleFactor;
    const py = this.y * scaleFactor;
    ctx.fillRect(px - s/2, py - s/2, s, s);
    ctx.globalAlpha = 1;
  }
}

class PowerUp {
  constructor(x, y) {
    this.x = Math.floor(x);
    this.y = Math.floor(y);
    const r = Math.random();
    this.type = r < 0.35 ? 'speed' : r < 0.7 ? 'shield' : 'health';
    this.alive = true;
    this.timer = 600;
    this.blink = 0;
  }

  update() {
    this.timer--;
    this.blink++;
    if (this.timer <= 0) this.alive = false;

    if (player && player.alive && this.alive) {
      const dx = player.x - (this.x + 0.5);
      const dy = player.y - (this.y + 0.5);
      if (Math.abs(dx) < 0.7 && Math.abs(dy) < 0.7) {
        this.apply();
        this.alive = false;
      }
    }
  }

  apply() {
    if (this.type === 'speed') {
      player.speed = Math.min(player.speed + 0.3, 2.5);
      setTimeout(() => { if (player) player.speed = 1.2; }, 10000);
      score += 200;
    } else if (this.type === 'shield') {
      player.invincible = 300;
      score += 200;
    } else if (this.type === 'health') {
      lives = Math.min(lives + 1, 10);
    }
    updateUI();
  }

  draw(ctx) {
    if (!this.alive) return;
    if (this.blink % 30 < 15) return;

    const cx = (this.x + 0.5) * CELL;
    const cy = (this.y + 0.5) * CELL;

    const pcolor = this.type === 'speed' ? '#4ecdc4' : this.type === 'health' ? '#00ff66' : '#ffd93d';
    ctx.fillStyle = pcolor;
    ctx.shadowColor = pcolor;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(cx, cy, CELL * 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#000';
    const fs = Math.max(10, CELL * 0.5);
    ctx.font = `${fs}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const icon = this.type === 'speed' ? '⚡' : this.type === 'health' ? '❤️' : '🛡️';
    ctx.fillText(icon, cx, cy);
  }
}

// ==================== 游戏逻辑 ====================

// 全部使用程序生成地图（种子保证同一关永远一样）
function getMapTemplate(lvl) {
  return generateMap(lvl);
}

function seededRandom(seed) {
  let s = seed;
  return function() {
    s = (s * 16807 + 0) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

function generateMap(seed) {
  const rand = seededRandom(seed);
  const map = new Array(COLS * ROWS).fill(0);

  const clearZone = (cx, cy, r) => {
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        const tx = cx + dx, ty = cy + dy;
        if (tx >= 0 && tx < COLS && ty >= 0 && ty < ROWS) map[ty * COLS + tx] = 0;
      }
    }
  };

  // 出生区保护（横屏新坐标）
  clearZone(17, 18, 2);
  clearZone(1, 1, 2);
  clearZone(COLS - 2, 1, 2);
  clearZone(COLS - 2, ROWS - 2, 2);

  const difficulty = Math.min(seed, 80);
  const brickDensity = 0.12 + difficulty * 0.004;
  const steelDensity = 0.02 + difficulty * 0.002;
  const grassDensity = 0.03 + difficulty * 0.001;

  // 砖墙
  for (let i = 0; i < COLS * ROWS * brickDensity; i++) {
    const x = Math.floor(rand() * (COLS - 4)) + 2;
    const y = Math.floor(rand() * (ROWS - 4)) + 2;
    if (map[y * COLS + x] === 0) map[y * COLS + x] = 1;
  }

  // 钢墙
  for (let i = 0; i < COLS * ROWS * steelDensity; i++) {
    const x = Math.floor(rand() * (COLS - 6)) + 3;
    const y = Math.floor(rand() * (ROWS - 10)) + 5;
    if (map[y * COLS + x] === 0) map[y * COLS + x] = 2;
  }

  // 草丛
  for (let i = 0; i < COLS * ROWS * grassDensity; i++) {
    const x = Math.floor(rand() * (COLS - 4)) + 2;
    const y = Math.floor(rand() * (ROWS - 6)) + 3;
    if (map[y * COLS + x] === 0) map[y * COLS + x] = 4;
  }

  // === 多样化特殊布局（适配34×20横屏） ===
  const pattern = seed % 12;
  const midX = Math.floor(COLS/2), midY = Math.floor(ROWS/2);

  if (pattern === 0 || pattern === 6) {
    // 环形钢墙堡垒
    for (let x = 5; x < COLS-5; x++) { map[4*COLS+x]=2; map[(ROWS-5)*COLS+x]=2; }
    for (let y = 4; y < ROWS-4; y++) { map[y*COLS+5]=2; map[y*COLS+(COLS-6)]=2; }
  }

  if (pattern === 1 || pattern === 7) {
    // 蛇形砖墙通道
    for (let row = 2; row < ROWS-2; row += 4) {
      const offset = (Math.floor(row/4) % 2) * 10;
      for (let x = 2 + offset; x < 14 + offset && x < COLS - 1; x++) {
        if (map[row * COLS + x] === 0) map[row * COLS + x] = 1;
      }
    }
  }

  if (pattern === 2 || pattern === 8) {
    // 对角线钢墙
    for (let i = 2; i < ROWS-3; i++) {
      if (map[i * COLS + i + 4] === 0) map[i * COLS + i + 4] = 2;
      if (map[i * COLS + (COLS - i - 5)] === 0) map[i * COLS + (COLS - i - 5)] = 2;
    }
  }

  if (pattern === 3 || pattern === 9) {
    // 四角草丛掩体
    for (let dy = 0; dy < 4; dy++) {
      for (let dx = 0; dx < 4; dx++) {
        if (map[(3+dy)*COLS+(3+dx)]===0) map[(3+dy)*COLS+(3+dx)]=4;
        if (map[(3+dy)*COLS+(COLS-4-dx)]===0) map[(3+dy)*COLS+(COLS-4-dx)]=4;
        if (map[(ROWS-4-dy)*COLS+(3+dx)]===0) map[(ROWS-4-dy)*COLS+(3+dx)]=4;
        if (map[(ROWS-4-dy)*COLS+(COLS-4-dx)]===0) map[(ROWS-4-dy)*COLS+(COLS-4-dx)]=4;
      }
    }
  }

  if (pattern === 4 || pattern === 10) {
    // 中央十字钢墙阵
    for (let y = midY-3; y < midY+3; y++) { if (map[y*COLS+midX]===0) map[y*COLS+midX]=2; }
    for (let x = midX-6; x < midX+6; x++) { if (map[midY*COLS+x]===0) map[midY*COLS+x]=2; }
    // 草丛
    for (let i = 0; i < 15; i++) {
      const gx = 2 + Math.floor(rand()*(COLS-4)), gy = 2 + Math.floor(rand()*5);
      if (map[gy*COLS+gx]===0) map[gy*COLS+gx]=4;
    }
  }

  if (pattern === 5 || pattern === 11) {
    // 棋盘格钢墙+砖墙
    for (let y = 3; y < ROWS-3; y += 3) {
      for (let x = 3; x < COLS-3; x += 3) {
        if ((x + y) % 6 === 0 && map[y*COLS+x]===0) map[y*COLS+x]=2;
        else if (map[y*COLS+x]===0) map[y*COLS+x]=1;
      }
    }
  }

  // 额外特色
  if (seed % 8 < 3) {
    for (let x = 2; x < COLS-2; x++) {
      const gy = midY-2 + Math.floor(rand()*5);
      if (gy>1 && gy<ROWS-1 && map[gy*COLS+x]===0) map[gy*COLS+x]=4;
    }
  }
  if (seed % 6 === 0) {
    for (let y = 3; y < ROWS-3; y++) {
      const sx = 6 + Math.floor(rand()*(COLS-12));
      if (map[y*COLS+sx]===0) map[y*COLS+sx]=2;
    }
  }
  if (seed % 9 < 2) {
    clearZone(midX, midY, 4);
  }

  return map;
}

function loadLevel(lvl) {
  mapData = [...getMapTemplate(lvl)];
  bullets = [];
  enemies = [];
  particles = [];
  powerUps = [];
  explosions = [];
  deathTimer = 0;

  player = new Tank(17, 18, DIR.UP, '#2ecc71', 1.2, true);
  player.turretDir = DIR.UP;
  player.invincible = 120;

  // 每关敌人数量递增：L1=10, L2=15, L3=20, L4=28, L5=35...
  enemiesRemaining = 8 + lvl * 2 + Math.floor(lvl * lvl / 3);
  enemiesOnScreen = 0;
  maxEnemiesOnScreen = Math.min(4 + lvl, 8);
  enemySpawnDelay = Math.max(30, 90 - lvl * 5);
  baseEnemySpeed = 0.7 + lvl * 0.1;
  enemySpawnTimer = 60;

  bossActive = false;
  bossTank = null;
  bossPhase = 1;
  demonKingActive = false;
  nukes = [];
  stamina = MAX_STAMINA;
  dashState = null;
  mythicMode = false;
  killStreak = 0;
  healthSpawnTimer = 180; // 3秒后开始
  updateUI();
}

// 魔王坦克（每2个Boss后召唤）
function spawnDemonKing() {
  demonKingActive = true;
  bossActive = true; // 复用boss系统
  bossPhase = 1;
  const bx = 17, by = 2;
  bossTank = new Tank(bx, by, DIR.DOWN, '#000000', 0.6, false);
  bossTank.hp = Math.floor((80 + level * 50) * 1.5); // 比普通Boss多50%血
  bossTank._maxHp = bossTank.hp;
  bossTank.size = 1.5;              // 巨型
  bossTank.shootDelay = 18;         // 极快射速
  bossTank.type = 'boss';
  bossTank._isDemonKing = true;     // 标记魔王
  bossTank.invincible = 90;
  bossTank.turretDir = DIR.DOWN;
  bossTank.speed = 0.6;

  // 清除出生区
  for (let dy = 0; dy < 4; dy++) {
    for (let dx = -3; dx <= 3; dx++) {
      const cx = Math.floor(bx) + dx, cy = Math.floor(by) + dy;
      if (cx >= 0 && cx < COLS && cy >= 0 && cy < ROWS) mapData[cy * COLS + cx] = 0;
    }
  }
  enemies.push(bossTank);
  enemiesOnScreen++;

  // 魔王出场特效
  for (let i = 0; i < 50; i++) {
    particles.push(new Particle(
      bx * BASE_CELL, by * BASE_CELL,
      (Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8,
      Math.random() < 0.5 ? '#ff0000' : '#000000',
      40 + Math.random() * 40
    ));
  }
}

function spawnBoss() {
  bossActive = true;
  demonKingActive = false;
  bossPhase = 1;
  // Boss出生在顶部中央
  const bx = 17, by = 2;
  bossTank = new Tank(bx, by, DIR.DOWN, '#8b00ff', 0.7, false);
  bossTank.hp = Math.floor((80 + level * 50) * 0.77); // L1=100, L2=138, L3=177...
  bossTank._maxHp = bossTank.hp;         // 记录最大血量
  bossTank.size = 1.2;               // 体型更大
  bossTank.shootDelay = 30;          // 射击更快
  bossTank.type = 'boss';
  bossTank.invincible = 60;          // 短暂无敌
  bossTank.turretDir = DIR.DOWN;

  // 清除出生点障碍
  for (let dy = 0; dy < 3; dy++) {
    for (let dx = -2; dx <= 2; dx++) {
      const cx = Math.floor(bx) + dx;
      const cy = Math.floor(by) + dy;
      if (cx >= 0 && cx < COLS && cy >= 0 && cy < ROWS) {
        mapData[cy * COLS + cx] = 0;
      }
    }
  }

  enemies.push(bossTank);
  enemiesOnScreen++;

  // Boss出场特效
  for (let i = 0; i < 30; i++) {
    particles.push(new Particle(
      bx * BASE_CELL, by * BASE_CELL,
      (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6,
      '#8b00ff', 30 + Math.random() * 30
    ));
  }
}

function spawnEnemy() {
  if (enemiesOnScreen >= maxEnemiesOnScreen || enemiesRemaining <= 0) return false;

  const sp = spawnPoints[Math.floor(Math.random() * spawnPoints.length)];
  const types = ['normal', 'normal', 'normal', 'fast', 'armored'];
  const type = level >= 2 ? types[Math.floor(Math.random() * types.length)] : 'normal';

  let color, speed, hp;
  switch (type) {
    case 'fast':
      color = '#f39c12'; speed = baseEnemySpeed * 1.6; hp = 1; break;
    case 'armored':
      color = '#e74c3c'; speed = baseEnemySpeed * 0.7; hp = 2; break;
    default:
      color = '#c0392b'; speed = baseEnemySpeed; hp = 1; break;
  }

  const enemy = new Tank(sp.x + 1, sp.y + 1, DIR.DOWN, color, speed, false);
  enemy.hp = hp;
  enemy.type = type;
  enemy.invincible = 40;

  if (!enemy.canMoveTo(enemy.x, enemy.y, enemy.dir)) {
    return false;
  }

  enemies.push(enemy);
  enemiesOnScreen++;
  return true;
}

function update() {
  if (gameState !== STATE.PLAYING) return;

  // 体力回复
  if (!dashState && stamina < MAX_STAMINA) {
    stamina = Math.min(MAX_STAMINA, stamina + 0.15); // 约9/sec，11秒回满
  }

  // 随机血包生成（每15秒左右一个）
  healthSpawnTimer--;
  if (healthSpawnTimer <= 0 && player && player.alive) {
    const hx = 2 + Math.random() * (COLS - 4);
    const hy = 2 + Math.random() * (ROWS - 4);
    const hp = new PowerUp(hx, hy);
    hp.type = 'health';
    hp.timer = 240; // 4秒消失
    powerUps.push(hp);
    healthSpawnTimer = 180; // 3秒
  }

  // 普通敌人全灭 → 召唤Boss
  if (!bossActive && enemiesRemaining <= 0 && enemies.length === 0 && player && player.alive) {
    spawnBoss();
  }

  // Boss 二阶段检测（偶数关，血量<50%触发）
  if (bossActive && bossTank && bossTank.alive && bossPhase === 1 && level % 2 === 0) {
    if (bossTank.hp <= bossTank._maxHp * 0.5) {
      bossPhase = 2;
      bossTank.color = '#ff0040';        // 变红
      bossTank.shootDelay = 14;          // 射速翻倍
      bossTank.speed = 0.9;              // 移动加快
      bossTank.invincible = 30;          // 短暂无敌
      // 二阶段特效
      for (let i = 0; i < 40; i++) {
        particles.push(new Particle(
          bossTank.x * BASE_CELL, bossTank.y * BASE_CELL,
          (Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8,
          Math.random() < 0.5 ? '#ff0040' : '#ffd700',
          30 + Math.random() * 40
        ));
      }
    }
  }

  // 更新核弹
  for (const nuke of nukes) {
    nuke.timer--;
    if (nuke.timer <= 0 && !nuke._exploded) {
      nuke._exploded = true;
      // 核弹爆炸
      const r = nuke.radius;
      for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
          const tx = Math.floor(nuke.x) + dx;
          const ty = Math.floor(nuke.y) + dy;
          if (tx >= 0 && tx < COLS && ty >= 0 && ty < ROWS) {
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist <= r) {
              // 摧毁砖墙（钢墙保留）
              if (mapData[ty * COLS + tx] === 1) {
                mapData[ty * COLS + tx] = 0;
              }
            }
          }
        }
      }
      // 伤害范围内玩家（玩家自己的核弹不伤自己）
      if (!nuke.isPlayerNuke && player && player.alive) {
        const pdx = player.x - nuke.x;
        const pdy = player.y - nuke.y;
        if (Math.sqrt(pdx*pdx + pdy*pdy) < r) {
          player.hit();
        }
      }
      // 伤害范围内敌人
      for (const enemy of enemies) {
        if (!enemy.alive) continue;
        const edx = enemy.x - nuke.x;
        const edy = enemy.y - nuke.y;
        if (Math.sqrt(edx*edx + edy*edy) < r) {
          enemy.hit();
        }
      }
      // 大爆炸特效
      for (let i = 0; i < 40; i++) {
        const a = Math.random() * Math.PI * 2;
        const dist = Math.random() * r * 0.8;
        particles.push(new Particle(
          nuke.x * BASE_CELL + Math.cos(a) * dist * BASE_CELL,
          nuke.y * BASE_CELL + Math.sin(a) * dist * BASE_CELL,
          (Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4,
          ['#ff4500', '#ff8c00', '#ffd700', '#ff0000'][Math.floor(Math.random()*4)],
          25 + Math.random() * 35
        ));
      }
    }
  }
  nukes = nukes.filter(n => n.timer > -30); // 爆炸后保留30帧特效

  // Boss/魔王被击败
  if (bossActive && (!bossTank || !bossTank.alive)) {
    const wasDemonKing = demonKingActive;
    bossActive = false;
    bossTank = null;
    bossPhase = 1;
    demonKingActive = false;

    if (!wasDemonKing) {
      bossKillCount++;
      // 每击杀2个普通Boss召唤魔王
      if (bossKillCount % 2 === 0) {
        spawnDemonKing();
        return;
      }
    }
    levelUp();
    return;
  }

  // Boss 在场时不刷小兵
  if (!bossActive) {
    enemySpawnTimer--;
    if (enemySpawnTimer <= 0 && enemiesRemaining > 0) {
      spawnEnemy();
      enemySpawnTimer = enemySpawnDelay + Math.floor(Math.random() * 30);
    }
  }

  // 处理玩家
  if (player) {
    if (player.alive) {
      player.update();
    } else if (deathTimer > 0) {
      // 死亡动画播放中
      deathTimer--;
      if (deathTimer <= 0) {
        if (lives <= 0) {
          gameOver(false);
        } else {
          respawnPlayer();
        }
      }
    }
  }

  // 首次检测到玩家死亡，启动死亡计时器
  if (player && !player.alive && deathTimer <= 0 && lives > 0) {
    lives--;
    updateUI();
    deathTimer = 45; // 0.75秒死亡动画
    // 记录死亡位置，原地复活
    if (!player._deathX) {
      player._deathX = player.x;
      player._deathY = player.y;
    }
  }

  for (const enemy of enemies) {
    if (enemy.alive) enemy.update();
  }

  for (const bullet of bullets) {
    if (bullet.alive) bullet.update();
  }

  for (const p of particles) {
    p.update();
  }

  for (const pu of powerUps) {
    if (pu.alive) pu.update();
  }

  bullets = bullets.filter(b => b.alive);
  enemies = enemies.filter(e => e.alive);
  particles = particles.filter(p => p.life > 0);
  powerUps = powerUps.filter(p => p.alive);
}

function respawnPlayer() {
  // 使用死亡位置原地复活
  const sx = player._deathX || 17;
  const sy = player._deathY || 18;
  // 清除复活点附近的敌人（不计入击杀）
  for (const enemy of enemies) {
    const dx = enemy.x - sx;
    const dy = enemy.y - sy;
    if (Math.abs(dx) < 2 && Math.abs(dy) < 2) {
      enemy.alive = false;
      enemiesOnScreen--;
      enemiesRemaining--;
    }
  }
  // 清除附近的敌方子弹
  for (const b of bullets) {
    if (!b.isPlayer && Math.abs(b.x - sx) < 2 && Math.abs(b.y - sy) < 2) {
      b.alive = false;
    }
  }
  player = new Tank(sx, sy, DIR.UP, '#2ecc71', 1.2, true);
  player.turretDir = DIR.UP;
  player.invincible = 120;
  updateUI();
}

// ==================== 存档系统（3个槽位） ====================
const SAVE_SLOTS = 3;
let currentSaveSlot = 1; // 当前使用的存档槽

function saveProgress(slot) {
  slot = slot || currentSaveSlot;
  const save = { level, score, kills, time: new Date().toLocaleString() };
  localStorage.setItem(`tankBattle_save_${slot}`, JSON.stringify(save));
}

function loadProgress(slot) {
  slot = slot || currentSaveSlot;
  try {
    const raw = localStorage.getItem(`tankBattle_save_${slot}`);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return null;
}

function hasSave(slot) {
  return !!loadProgress(slot || currentSaveSlot);
}

function getAllSaves() {
  const saves = [];
  for (let i = 1; i <= SAVE_SLOTS; i++) {
    const s = loadProgress(i);
    saves.push(s ? { slot: i, ...s } : null);
  }
  return saves;
}

function levelUp() {
  level++;
  score += 500;
  updateUI();
  // 胜利特效
  victoryTimer = 120;
  for (let i = 0; i < 80; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 1 + Math.random() * 3;
    victoryParticles.push({
      x: (COLS / 2) * CELL,
      y: (ROWS / 2) * CELL,
      vx: Math.cos(a) * spd,
      vy: Math.sin(a) * spd - 2,
      life: 40 + Math.random() * 40,
      maxLife: 80,
      color: ['#ffd700','#ff4500','#ff0080','#00ff88','#00ccff','#ff8c00'][Math.floor(Math.random()*6)],
      size: 2 + Math.random() * 4
    });
  }
  gameState = STATE.PAUSED;
  // 胜利动画结束后显示存档选择
  setTimeout(() => {
    if (gameState === STATE.PAUSED) {
      victoryTimer = 0;
      victoryParticles = [];
      document.getElementById('savePromptLevel').textContent = level;
      document.getElementById('savePromptOverlay').classList.remove('hidden');
    }
  }, 2000);
}

function proceedToNextLevel() {
  document.getElementById('savePromptOverlay').classList.add('hidden');
  loadLevel(level);
  gameState = STATE.PLAYING;
}

function gameOver(won) {
  gameState = STATE.GAMEOVER;
  const titleEl = document.getElementById('gameOverTitle');
  if (won) {
    titleEl.textContent = '🏆 恭喜通关!';
    titleEl.style.color = '#ffd700';
    titleEl.style.fontSize = '48px';
  } else {
    titleEl.innerHTML = '💥 <span style="font-size:80px;color:#ff0000;text-shadow:0 0 40px #ff0000,0 0 80px #ff4500;display:block;animation:pulse 0.5s infinite;">菜</span>';
    titleEl.style.color = '#ff4444';
  }
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalKills').textContent = kills;
  document.getElementById('finalLevel').textContent = level;
  // 显示继续按钮
  const save = loadProgress(currentSaveSlot);
  const contBtn = document.getElementById('continueBtn');
  if (save && !won) {
    contBtn.classList.remove('hidden');
    contBtn.textContent = `📂 继续存档${currentSaveSlot} (第${save.level}关)`;
  } else {
    contBtn.classList.add('hidden');
  }
  document.getElementById('gameOverOverlay').classList.remove('hidden');
}

function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('level').textContent = level;
  document.getElementById('lives').textContent = Math.max(0, lives);
  document.getElementById('kills').textContent = kills;
  const ss = document.getElementById('streakStat');
  if (killStreak >= 2) {
    ss.style.display = 'flex';
    document.getElementById('streakDisplay').textContent = killStreak;
  } else {
    ss.style.display = 'none';
  }
}

function resetGame() {
  score = 0;
  level = 1;
  lives = 10;
  kills = 0;
  killStreak = 0;
  mythicMode = false;
  dashState = null;
  stamina = MAX_STAMINA;
  deathTimer = 0;
  bossActive = false;
  bossTank = null;
  bossPhase = 1;
  demonKingActive = false;
  bossKillCount = 0;
  nukes = [];
  enemiesRemaining = 0;
  enemiesOnScreen = 0;
  maxEnemiesOnScreen = 4;
  enemySpawnTimer = 0;
  enemySpawnDelay = 90;
  baseEnemySpeed = 1.0;
  updateUI();
}

// ==================== 渲染 ====================

function render() {
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 地图
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const tile = mapData[y * COLS + x];
      if (tile === 4) continue;
      const px = x * CELL;
      const py = y * CELL;

      switch (tile) {
        case 1: // 砖墙
          ctx.fillStyle = '#c4934a';
          ctx.fillRect(px, py, CELL, CELL);
          ctx.strokeStyle = '#8b5e2b';
          ctx.lineWidth = 1;
          ctx.strokeRect(px + 0.5, py + 0.5, CELL - 1, CELL - 1);
          ctx.fillStyle = '#a07030';
          ctx.fillRect(px + CELL*0.15, py + CELL*0.15, CELL*0.35, CELL*0.35);
          ctx.fillRect(px + CELL*0.5, py + CELL*0.5, CELL*0.35, CELL*0.35);
          break;
        case 2: // 钢墙
          ctx.fillStyle = '#7f8c8d';
          ctx.fillRect(px, py, CELL, CELL);
          ctx.fillStyle = '#95a5a6';
          ctx.fillRect(px + 2, py + 2, CELL - 4, CELL - 4);
          [[3,3],[CELL-7,3],[3,CELL-7],[CELL-7,CELL-7]].forEach(([rx, ry]) => {
            ctx.fillStyle = '#555';
            ctx.beginPath();
            ctx.arc(px + rx + 2, py + ry + 2, Math.max(1.5, CELL*0.08), 0, Math.PI*2);
            ctx.fill();
          });
          break;
        case 3: // 水
          ctx.fillStyle = '#2471a3';
          ctx.fillRect(px, py, CELL, CELL);
          break;
        default:
          if ((x + y) % 2 === 0 && CELL > 6) {
            ctx.fillStyle = '#111';
            ctx.fillRect(px, py, CELL, CELL);
          }
          break;
      }
    }
  }

  // 道具
  for (const pu of powerUps) pu.draw(ctx);

  // 坦克
  for (const enemy of enemies) enemy.draw(ctx);
  if (player && player.alive) player.draw(ctx);

  // 子弹
  for (const bullet of bullets) bullet.draw(ctx);

  // 粒子
  for (const p of particles) p.draw(ctx);

  // 草丛 (覆盖层)
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const tile = mapData[y * COLS + x];
      if (tile === 4) {
        const px = x * CELL;
        const py = y * CELL;
        ctx.fillStyle = '#1e8449';
        ctx.fillRect(px, py, CELL, CELL);
        ctx.fillStyle = '#27ae60';
        for (let i = 0; i < 6; i++) {
          const gx = px + (i * 11 + x * 5) % CELL;
          const gy = py + (i * 7 + y * 3) % CELL;
          ctx.fillRect(gx, gy, Math.max(2, CELL*0.12), Math.max(4, CELL*0.2));
        }
      }
    }
  }

  // 胜利动画
  if (victoryTimer > 0) {
    // 烟花粒子
    for (const vp of victoryParticles) {
      vp.x += vp.vx;
      vp.y += vp.vy;
      vp.vy += 0.02; // 重力
      vp.life--;
      const alpha = vp.life / vp.maxLife;
      ctx.fillStyle = vp.color;
      ctx.globalAlpha = alpha;
      ctx.fillRect(vp.x - vp.size/2, vp.y - vp.size/2, vp.size, vp.size);
    }
    ctx.globalAlpha = 1;

    // 胜利大字
    const vt = 1 - victoryTimer / 120;
    const vscale = 0.3 + vt * 0.7;
    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2 - 20);
    ctx.scale(vscale, vscale);
    ctx.fillStyle = '#ffd700';
    ctx.shadowColor = '#ff8c00';
    ctx.shadowBlur = 30;
    const vfs = Math.max(36, CELL * 1.6);
    ctx.font = `bold ${vfs}px "Microsoft YaHei", Arial`;
    ctx.textAlign = 'center';
    ctx.fillText('🎉 过 关 ! 🎉', 0, 0);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    const sfs = Math.max(16, CELL * 0.7);
    ctx.font = `bold ${sfs}px "Microsoft YaHei", Arial`;
    ctx.fillText(`第 ${level} 关 通过`, 0, vfs * 0.7);
    ctx.restore();
    victoryTimer--;
  }

  // 关卡提示
  if (gameState === STATE.PAUSED && level > 1 && enemiesRemaining > 0 && victoryTimer <= 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, canvas.height/2 - Math.max(20, CELL*1.2), canvas.width, Math.max(40, CELL*2.4));
    ctx.fillStyle = '#e94560';
    const fs = Math.max(16, CELL);
    ctx.font = `bold ${fs}px "Microsoft YaHei", Arial`;
    ctx.textAlign = 'center';
    ctx.fillText(`🏆 第 ${level} 关`, canvas.width/2, canvas.height/2 + 8);
  }

  // 敌人剩余指示
  for (let i = 0; i < Math.min(enemiesRemaining, 20); i++) {
    const row = Math.floor(i / 2);
    const col = i % 2;
    const is = Math.max(3, CELL * 0.25);
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(
      COLS * CELL - (is + 2) * 3 + col * (is + 2),
      6 + row * (is + 2),
      is, is
    );
  }

  // 核弹警告圈
  for (const nuke of nukes) {
    if (nuke._exploded) continue;
    const progress = 1 - nuke.timer / nuke.maxTimer;
    const pulse = 0.5 + Math.sin(Date.now() / 100) * 0.5;
    const alpha = 0.3 + progress * 0.5 + pulse * 0.2;
    const nx = nuke.x * CELL;
    const ny = nuke.y * CELL;
    const nr = nuke.radius * CELL;
    // 玩家核弹蓝色，Boss核弹红色
    const isPN = nuke.isPlayerNuke;
    const fillColor = isPN ? `rgba(0, 180, 255, ${alpha * 0.3})` : `rgba(255, 30, 0, ${alpha * 0.3})`;
    const strokeColor = isPN ? `rgba(0, 200, 255, ${alpha})` : `rgba(255, 50, 0, ${alpha})`;

    // 填充
    ctx.fillStyle = fillColor;
    ctx.beginPath();
    ctx.arc(nx, ny, nr, 0, Math.PI * 2);
    ctx.fill();
    // 边框
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = 2 + pulse * 2;
    ctx.setLineDash([8, 4]);
    ctx.beginPath();
    ctx.arc(nx, ny, nr, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineWidth = 1;
    // 倒计时文字
    const secLeft = (nuke.timer / 60).toFixed(1);
    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
    const nfs = Math.max(13, CELL * 0.55);
    ctx.font = `bold ${nfs}px Arial`;
    ctx.textAlign = 'center';
    ctx.fillText(`☢ ${secLeft}s`, nx, ny + nfs * 0.35);
    // 中心点
    ctx.fillStyle = '#ff0000';
    ctx.beginPath();
    ctx.arc(nx, ny, Math.max(3, CELL * 0.15), 0, Math.PI * 2);
    ctx.fill();
  }

  // Boss 警告
  if (bossActive && bossTank && bossTank.alive) {
    const isP2 = bossPhase === 2;
    const bpulse = 0.5 + Math.sin(Date.now() / 150) * 0.5;
    const bcolor = isP2 ? `rgba(255, 0, 64, ${0.5 + bpulse * 0.5})` : `rgba(139, 0, 255, ${0.4 + bpulse * 0.6})`;
    ctx.fillStyle = bcolor;
    const bfs = Math.max(20, CELL * 0.9);
    ctx.font = `bold ${bfs}px "Microsoft YaHei", Arial`;
    ctx.textAlign = 'center';
    const dkLabel = bossTank._isDemonKing ? '👑 魔 王 👑' : (isP2 ? '⚠ BOSS · PHASE 2 ⚠' : '⚠ BOSS ⚠');
    ctx.fillText(dkLabel, canvas.width / 2, 30);
    // Boss血条
    const barW = canvas.width * 0.4;
    const barH = 6;
    const barX = (canvas.width - barW) / 2;
    const barY = 38;
    ctx.fillStyle = '#333';
    ctx.fillRect(barX, barY, barW, barH);
    const hpRatio = bossTank.hp / bossTank._maxHp;
    const hpColor = isP2 ? '#ff0040' : (hpRatio > 0.5 ? '#8b00ff' : hpRatio > 0.25 ? '#ff8c00' : '#ff0000');
    ctx.fillStyle = hpColor;
    ctx.fillRect(barX, barY, barW * Math.max(0, hpRatio), barH);
    // 二阶段指示线
    if (!isP2 && level % 2 === 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillRect(barX + barW * 0.5 - 1, barY, 2, barH);
    }
  }

  // 血量条（左上角）
  const hpBarX = 8, hpBarY = 8;
  const hpBarW = 120, hpBarH = 10;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(hpBarX - 1, hpBarY - 1, hpBarW + 2, hpBarH + 2);
  ctx.fillStyle = '#400';
  ctx.fillRect(hpBarX, hpBarY, hpBarW, hpBarH);
  const hpRatio = Math.max(0, lives) / 10;
  const hpColor = hpRatio > 0.5 ? '#ff4444' : hpRatio > 0.25 ? '#ff8800' : '#ff0000';
  ctx.fillStyle = hpColor;
  ctx.fillRect(hpBarX, hpBarY, hpBarW * hpRatio, hpBarH);
  // 血量文字和爱心
  ctx.fillStyle = '#fff';
  const hpfs = Math.max(10, CELL * 0.42);
  ctx.font = `bold ${hpfs}px Arial`;
  ctx.textAlign = 'left';
  ctx.fillText(`❤️ ${Math.max(0, lives)}`, hpBarX, hpBarY - 4);

  // 得分和击杀（血条下方）
  ctx.fillStyle = '#ffd700';
  const sfs = Math.max(9, CELL * 0.38);
  ctx.font = `${sfs}px Arial`;
  ctx.fillText(`⭐${score}`, hpBarX, hpBarY + hpBarH + 12);
  ctx.fillStyle = '#fff';
  ctx.fillText(`💀${kills}`, hpBarX + 60, hpBarY + hpBarH + 12);
  // 关卡
  ctx.fillStyle = '#4ecdc4';
  ctx.fillText(`🏆${level}`, hpBarX, hpBarY + hpBarH + 24);

  // 体力条（左上血条下方）
  const stBarW = 80, stBarH = 4;
  const stBarX = 8, stBarY = hpBarY + hpBarH + 36;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(stBarX - 1, stBarY - 1, stBarW + 2, stBarH + 2);
  ctx.fillStyle = '#333';
  ctx.fillRect(stBarX, stBarY, stBarW, stBarH);
  const stRatio = stamina / MAX_STAMINA;
  ctx.fillStyle = stRatio > 0.5 ? '#4ecdc4' : stRatio > 0.25 ? '#ff8c00' : '#ff0000';
  ctx.fillRect(stBarX, stBarY, stBarW * stRatio, stBarH);
  ctx.fillStyle = '#aaa';
  const stfs = Math.max(8, CELL * 0.32);
  ctx.font = `${stfs}px Arial`;
  ctx.fillText(`⚡${Math.ceil(stamina)}`, stBarX + stBarW + 3, stBarY + stBarH);

  // 神话模式指示器
  if (mythicMode && player && player.alive) {
    const pulse = 0.7 + Math.sin(Date.now() / 120) * 0.3;
    ctx.fillStyle = `rgba(255, 215, 0, ${pulse})`;
    const fs2 = Math.max(14, CELL * 0.6);
    ctx.font = `bold ${fs2}px "Microsoft YaHei", Arial`;
    ctx.textAlign = 'left';
    const txt = `🔥 神话模式 x${killStreak}`;
    const tw = ctx.measureText(txt).width;
    ctx.fillText(txt, 8, canvas.height - 10);

    // 连杀计数
    ctx.fillStyle = '#ffd700';
    ctx.font = `bold ${Math.max(11, CELL * 0.45)}px Arial`;
    ctx.textAlign = 'right';
    ctx.fillText(`连杀: ${killStreak}`, canvas.width - 14, canvas.height - 24);
  }
}

// ==================== 游戏循环 ====================

function gameLoop() {
  update();
  render();
  animationId = requestAnimationFrame(gameLoop);
}

// ==================== 事件处理 ====================

window.addEventListener('keydown', function pauseHandler(e) {
  if (e.key === 'p' || e.key === 'P') {
    if (gameState === STATE.PLAYING) pauseGame();
    else if (gameState === STATE.PAUSED) resumeGame();
  }
});

function pauseGame() {
  if (gameState !== STATE.PLAYING) return;
  gameState = STATE.PAUSED;
  document.getElementById('pauseOverlay').classList.remove('hidden');
}

function resumeGame() {
  if (gameState !== STATE.PAUSED) return;
  gameState = STATE.PLAYING;
  document.getElementById('pauseOverlay').classList.add('hidden');
}

document.getElementById('startFullscreenBtn').addEventListener('click', () => {
  if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
});
document.getElementById('startBtn').addEventListener('click', () => startGame(1));
document.getElementById('resumeBtn').addEventListener('click', resumeGame);
document.getElementById('restartBtn').addEventListener('click', () => startGame(currentSaveSlot));
document.getElementById('continueBtn').addEventListener('click', () => continueGame(currentSaveSlot));
document.getElementById('saveYesBtn').addEventListener('click', () => {
  saveProgress(currentSaveSlot);
  refreshSaveSlotButtons();
  proceedToNextLevel();
});
document.getElementById('saveNoBtn').addEventListener('click', () => {
  proceedToNextLevel();
});

// 存档槽按钮
document.querySelectorAll('.save-slot-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const slot = parseInt(btn.dataset.slot);
    if (hasSave(slot)) {
      continueGame(slot);
    } else {
      startGame(slot); // 空槽位开始新游戏
    }
  });
});

function startGame(slot) {
  currentSaveSlot = slot || 1;
  for (const k in touchKeys) touchKeys[k] = false;
  for (const k in keys) keys[k] = false;
  document.querySelectorAll('.active').forEach(el => el.classList.remove('active'));

  resetGame();
  level = selectedLevel;
  document.getElementById('startOverlay').classList.add('hidden');
  document.getElementById('pauseOverlay').classList.add('hidden');
  document.getElementById('gameOverOverlay').classList.add('hidden');
  gameState = STATE.PLAYING;
  resizeCanvas();
  loadLevel(level);

  // 手机端强制横屏+全屏
  if (isTouchDevice || window.innerWidth < 768) {
    // 先全屏
    const el = document.documentElement;
    const goFS = () => {
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    };
    goFS();
    // 再锁横屏
    setTimeout(() => {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
      goFS(); // 再试一次
    }, 300);
  }
}

function continueGame(slot) {
  currentSaveSlot = slot || 1;
  const save = loadProgress(currentSaveSlot);
  if (!save) {
    alert('该存档为空！');
    return;
  }
  for (const k in touchKeys) touchKeys[k] = false;
  for (const k in keys) keys[k] = false;
  document.querySelectorAll('.active').forEach(el => el.classList.remove('active'));

  resetGame();
  selectedLevel = save.level; // 同步选择器
  level = save.level;
  score = save.score;
  kills = save.kills || 0;
  updateUI();

  document.getElementById('startOverlay').classList.add('hidden');
  document.getElementById('pauseOverlay').classList.add('hidden');
  document.getElementById('gameOverOverlay').classList.add('hidden');
  gameState = STATE.PLAYING;
  resizeCanvas();
  loadLevel(level);
}

// 关卡选择按钮（1-66）
let selectedLevel = 1;
const levelGrid = document.getElementById('levelGrid');
for (let l = 1; l <= 66; l++) {
  const btn = document.createElement('button');
  btn.textContent = l;
  btn.dataset.lvl = l;
  btn.style.cssText = 'background:#e94560;color:#fff;border:none;padding:3px 0;border-radius:3px;cursor:pointer;font-size:11px;font-weight:bold;min-width:28px;';
  btn.addEventListener('click', () => {
    selectedLevel = l;
    document.querySelectorAll('#levelGrid button').forEach(b => {
      b.style.background = '#e94560';
      b.style.color = '#fff';
    });
    btn.style.background = '#ffd700';
    btn.style.color = '#000';
    document.getElementById('selectedLevelText').textContent = `已选：第 ${l} 关`;
  });
  levelGrid.appendChild(btn);
}
// 默认第一关高亮
levelGrid.children[0].style.background = '#ffd700';
levelGrid.children[0].style.color = '#000';

// 自动适配屏幕
function checkOrientation() {
  const isMobile = isTouchDevice || window.innerWidth < 768;
  const isLandscape = window.innerWidth > window.innerHeight;
  const prompt = document.getElementById('rotatePrompt');

  // 竖屏时提示旋转
  if (isMobile && !isLandscape && gameState === STATE.PLAYING) {
    prompt.classList.remove('hidden');
  } else {
    prompt.classList.add('hidden');
  }

  // 自适应画布大小
  resizeCanvas();

  // 自适应摇杆大小
  const joySize = Math.min(100, window.innerHeight * 0.22);
  document.querySelectorAll('.joystick-area').forEach(j => {
    j.style.width = joySize + 'px';
    j.style.height = joySize + 'px';
  });
}

// 初始检测
checkOrientation();
window.addEventListener('resize', checkOrientation);
window.addEventListener('orientationchange', () => setTimeout(checkOrientation, 300));

// 手机端：点击任意处触发全屏横屏
if (isTouchDevice) {
  const triggerFS = () => {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(() => {});
    }
    document.removeEventListener('click', triggerFS);
    document.removeEventListener('touchstart', triggerFS);
  };
  document.addEventListener('click', triggerFS, { once: true });
  document.addEventListener('touchstart', triggerFS, { once: true });
}

// 初始加载：刷新存档槽按钮文字
function refreshSaveSlotButtons() {
  const saves = getAllSaves();
  document.querySelectorAll('.save-slot-btn').forEach(btn => {
    const slot = parseInt(btn.dataset.slot);
    const save = saves[slot - 1];
    if (save) {
      btn.textContent = `📂 存档${slot} (第${save.level}关)`;
      btn.style.opacity = '1';
      btn.style.background = '#4ecdc4';
    } else {
      btn.textContent = `💾 存档${slot} (空)`;
      btn.style.opacity = '0.6';
      btn.style.background = '#555';
    }
  });
}
refreshSaveSlotButtons();
loadLevel(1);
gameState = STATE.MENU;
gameLoop();

console.log('🎮 坦克大战已就绪!');
console.log('桌面: 方向键移动 + 空格射击 | 手机: 虚拟摇杆 + 开火按钮');
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 坦克大战 - Battle City</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Courier New', 'Microsoft YaHei', monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  .game-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 700px;
    padding: 8px 16px;
    background: #16213e;
    border: 2px solid #e94560;
    border-radius: 8px;
  }

  .game-title {
    font-size: 24px;
    font-weight: bold;
    color: #e94560;
    text-shadow: 0 0 10px rgba(233,69,96,0.5);
    letter-spacing: 2px;
  }

  .game-stats {
    display: flex;
    gap: 24px;
    color: #eee;
    font-size: 14px;
  }

  .stat {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .stat-label {
    color: #888;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .stat-value {
    color: #0f3460;
    background: #e94560;
    padding: 2px 10px;
    border-radius: 4px;
    font-weight: bold;
    font-size: 16px;
    min-width: 40px;
    text-align: center;
  }

  canvas {
    border: 3px solid #0f3460;
    border-radius: 4px;
    background: #0a0a0a;
    image-rendering: pixelated;
    box-shadow: 0 0 30px rgba(233,69,96,0.2), inset 0 0 60px rgba(0,0,0,0.3);
  }

  .game-controls {
    display: flex;
    gap: 20px;
    align-items: center;
    color: #888;
    font-size: 12px;
  }

  .key-hint {
    background: #16213e;
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid #333;
    letter-spacing: 1px;
  }

  .key-hint span {
    color: #e94560;
    font-weight: bold;
  }

  .overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }

  .overlay-content {
    text-align: center;
    color: #eee;
  }

  .overlay-content h1 {
    font-size: 48px;
    color: #e94560;
    margin-bottom: 12px;
    text-shadow: 0 0 20px rgba(233,69,96,0.6);
  }

  .overlay-content h2 {
    font-size: 28px;
    color: #e94560;
    margin-bottom: 20px;
  }

  .overlay-content p {
    margin: 8px 0;
    color: #aaa;
    font-size: 14px;
  }

  .btn {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 36px;
    font-size: 18px;
    font-weight: bold;
    font-family: inherit;
    color: #fff;
    background: #e94560;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 2px;
    transition: all 0.2s;
  }

  .btn:hover {
    background: #ff6b81;
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(233,69,96,0.5);
  }

  .hidden { display: none !important; }

// ==================== 类定义 ====================

class Tank {
  constructor(x, y, dir, color, speed, isPlayer = false) {
    this.x = x;           // 网格坐标
    this.y = y;
    this.dir = dir;
    this.color = color;
    this.speed = speed;
    this.isPlayer = isPlayer;
    this.size = 0.85;     // 坦克尺寸 (相对于单元格)
    this.alive = true;
    this.shootCooldown = 0;
    this.shootDelay = isPlayer ? 15 : 50;
    this.moveTimer = 0;
    this.moveDelay = isPlayer ? 0 : 40 + Math.floor(Math.random() * 60);
    this.changeDirTimer = 0;
    this.changeDirDelay = 60 + Math.floor(Math.random() * 120);
    this.flashTimer = 0;
    this.invincible = isPlayer ? 120 : 0; // 出生无敌时间
    this.hp = 1;
    this.type = 'normal';
  }

  update() {
    if (!this.alive) return;

    if (this.shootCooldown > 0) this.shootCooldown--;
    if (this.invincible > 0) this.invincible--;
    if (this.flashTimer > 0) this.flashTimer--;

    if (!this.isPlayer) {
      this.aiUpdate();
    } else {
      this.playerInput();
    }

    // 移动
    if (this.moveTimer <= 0) {
      let moved = this.tryMove(this.dir);
      if (moved) {
        this.moveTimer = this.isPlayer ? 2 : this.moveDelay;
      }
      if (!moved && !this.isPlayer) {
        this.changeDirTimer = 0; // 碰墙立即换方向
      }
    } else {
      this.moveTimer--;
    }
  }

  playerInput() {
    let newDir = null;
    if (keys['ArrowUp'] || keys['KeyW']) newDir = DIR.UP;
    else if (keys['ArrowDown'] || keys['KeyS']) newDir = DIR.DOWN;
    else if (keys['ArrowLeft'] || keys['KeyA']) newDir = DIR.LEFT;
    else if (keys['ArrowRight'] || keys['KeyD']) newDir = DIR.RIGHT;

    if (newDir) {
      if (this.dir !== newDir) {
        this.dir = newDir;
        this.moveTimer = 0;
      }
    } else {
      this.moveTimer = 1; // 不按键时停止
    }

    if (keys[' '] || keys['Space']) {
      this.shoot();
    }
  }

  aiUpdate() {
    this.changeDirTimer--;

    // 有时随机改变方向
    if (this.changeDirTimer <= 0 || Math.random() < 0.01) {
      const dirs = [DIR.UP, DIR.DOWN, DIR.LEFT, DIR.RIGHT];
      // 偏向玩家方向
      if (player && player.alive && Math.random() < 0.4) {
        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const candidates = [];
        if (Math.abs(dx) > Math.abs(dy)) {
          candidates.push(dx > 0 ? DIR.RIGHT : DIR.LEFT);
          candidates.push(dy > 0 ? DIR.DOWN : DIR.UP);
        } else {
          candidates.push(dy > 0 ? DIR.DOWN : DIR.UP);
          candidates.push(dx > 0 ? DIR.RIGHT : DIR.LEFT);
        }
        this.dir = candidates[0];
      } else {
        this.dir = dirs[Math.floor(Math.random() * 4)];
      }
      this.changeDirTimer = this.changeDirDelay;
    }

    // AI射击
    if (this.shootCooldown <= 0 && Math.random() < 0.03) {
      this.shoot();
    }
  }

  tryMove(dir) {
    const newX = this.x + dir.x * this.speed * 0.15;
    const newY = this.y + dir.y * this.speed * 0.15;

    return this.canMoveTo(newX, newY, dir);
  }

  canMoveTo(nx, ny, dir) {
    // 边界检测
    const margin = this.size / 2;
    if (nx - margin < 0 || nx + margin >= COLS ||
        ny - margin < 0 || ny + margin >= ROWS) {
      return false;
    }

    // 碰撞检测四个角
    const corners = [
      { x: nx - margin + 0.1, y: ny - margin + 0.1 },
      { x: nx + margin - 0.1, y: ny - margin + 0.1 },
      { x: nx - margin + 0.1, y: ny + margin - 0.1 },
      { x: nx + margin - 0.1, y: ny + margin - 0.1 },
    ];

    for (const corner of corners) {
      const cx = Math.floor(corner.x);
      const cy = Math.floor(corner.y);
      if (cx < 0 || cx >= COLS || cy < 0 || cy >= ROWS) return false;

      const tile = mapData[cy * COLS + cx];
      if (tile === 1 || tile === 2) return false; // 砖墙或钢墙
      if (tile === 3) return false; // 水
    }

    // 与其他坦克碰撞
    const allTanks = this.isPlayer ? enemies : [player, ...enemies.filter(e => e !== this && e.alive)];
    for (const tank of allTanks) {
      if (!tank || !tank.alive) continue;
      if (tank === this) continue;
      const dx = nx - tank.x;
      const dy = ny - tank.y;
      const minDist = this.size * 0.8;
      if (Math.abs(dx) < minDist && Math.abs(dy) < minDist) {
        return false;
      }
    }

    return true;
  }

  shoot() {
    if (this.shootCooldown > 0) return;
    this.shootCooldown = this.shootDelay;

    const bx = this.x + this.dir.x * 0.5;
    const by = this.y + this.dir.y * 0.5;

    bullets.push(new Bullet(bx, by, this.dir, this.isPlayer));
  }

  hit() {
    this.hp--;
    if (this.hp <= 0) {
      this.alive = false;
      this.onDestroy();
    } else {
      this.flashTimer = 20;
    }
  }

  onDestroy() {
    // 爆炸粒子
    for (let i = 0; i < 12; i++) {
      particles.push(new Particle(
        this.x * CELL, this.y * CELL,
        (Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4,
        this.color,
        20 + Math.random() * 20
      ));
    }

    if (!this.isPlayer) {
      kills++;
      score += this.type === 'fast' ? 300 : this.type === 'armored' ? 500 : 100;
      enemiesOnScreen--;
      enemiesRemaining--;

      // 概率掉落道具
      if (Math.random() < 0.15) {
        powerUps.push(new PowerUp(this.x, this.y));
      }
    }

    updateUI();
  }

  draw(ctx) {
    if (!this.alive) return;
    if (this.invincible > 0 && Math.floor(this.invincible / 4) % 2 === 0) return;
    if (this.flashTimer > 0 && Math.floor(this.flashTimer / 3) % 2 === 0) return;

    const cx = this.x * CELL;
    const cy = this.y * CELL;
    const half = (this.size * CELL) / 2;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(this.dir.angle);

    // 坦克主体
    ctx.fillStyle = this.color;
    ctx.fillRect(-half, -half * 0.85, half * 2, half * 1.7);

    // 履带
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-half - 2, -half * 0.85, 5, half * 1.7);
    ctx.fillRect(half - 3, -half * 0.85, 5, half * 1.7);

    // 履带纹理
    ctx.fillStyle = '#333';
    for (let i = -half * 0.7; i < half * 0.7; i += 5) {
      ctx.fillRect(-half - 2, i, 5, 2);
      ctx.fillRect(half - 3, i, 5, 2);
    }

    // 炮塔
    const turretColor = this.isPlayer ? '#4ecdc4' : '#ffd93d';
    ctx.fillStyle = turretColor;
    ctx.beginPath();
    ctx.arc(0, 0, half * 0.55, 0, Math.PI * 2);
    ctx.fill();

    // 炮管
    ctx.fillStyle = turretColor;
    ctx.fillRect(-2, -half * 0.85, 5, half * 1.1);

    // 炮管尖端
    ctx.fillStyle = '#fff';
    ctx.fillRect(-1, -half * 0.85 - 2, 3, 5);

    ctx.restore();
  }
}

class Bullet {
  constructor(x, y, dir, isPlayer) {
    this.x = x;
    this.y = y;
    this.dir = dir;
    this.isPlayer = isPlayer;
    this.speed = 0.22;
    this.alive = true;
    this.size = 3;
  }

  update() {
    this.x += this.dir.x * this.speed;
    this.y += this.dir.y * this.speed;

    // 边界检测
    if (this.x < 0 || this.x >= COLS || this.y < 0 || this.y >= ROWS) {
      this.alive = false;
      this.spark();
      return;
    }

    // 地图碰撞
    const cx = Math.floor(this.x);
    const cy = Math.floor(this.y);
    if (cx >= 0 && cx < COLS && cy >= 0 && cy < ROWS) {
      const tile = mapData[cy * COLS + cx];
      if (tile === 1) {
        // 摧毁砖墙
        mapData[cy * COLS + cx] = 0;
        for (let i = 0; i < 5; i++) {
          particles.push(new Particle(
            cx * CELL + CELL/2, cy * CELL + CELL/2,
            (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2,
            '#c4934a', 15 + Math.random() * 10
          ));
        }
        this.alive = false;
        return;
      }
      if (tile === 2) {
        // 钢墙无法摧毁
        this.alive = false;
        this.spark();
        return;
      }
    }

    // 坦克碰撞
    const targets = this.isPlayer ? enemies : (player && player.alive ? [player] : []);
    for (const tank of targets) {
      if (!tank || !tank.alive) continue;
      const dx = this.x - tank.x;
      const dy = this.y - tank.y;
      if (Math.abs(dx) < tank.size * 0.5 && Math.abs(dy) < tank.size * 0.5) {
        tank.hit();
        this.alive = false;
        return;
      }
    }

    // 子弹碰撞
    if (this.isPlayer) {
      for (const bullet of bullets) {
        if (bullet === this || !bullet.alive || bullet.isPlayer) continue;
        const dx = this.x - bullet.x;
        const dy = this.y - bullet.y;
        if (Math.abs(dx) < 0.25 && Math.abs(dy) < 0.25) {
          this.alive = false;
          bullet.alive = false;
          return;
        }
      }
    }
  }

  spark() {
    for (let i = 0; i < 4; i++) {
      particles.push(new Particle(
        this.x * CELL, this.y * CELL,
        (Math.random() - 0.5) * 3, (Math.random() - 0.5) * 3,
        '#ffd93d', 8 + Math.random() * 8
      ));
    }
  }

  draw(ctx) {
    if (!this.alive) return;
    ctx.fillStyle = this.isPlayer ? '#fff' : '#ff6b6b';
    ctx.shadowColor = this.isPlayer ? '#4ecdc4' : '#ff4444';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(this.x * CELL, this.y * CELL, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

class Particle {
  constructor(x, y, vx, vy, color, life) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.color = color;
    this.life = life;
    this.maxLife = life;
    this.size = 1 + Math.random() * 2;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
    this.vx *= 0.95;
    this.vy *= 0.95;
  }

  draw(ctx) {
    if (this.life <= 0) return;
    const alpha = this.life / this.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
    ctx.globalAlpha = 1;
  }
}

class PowerUp {
  constructor(x, y) {
    this.x = Math.floor(x);
    this.y = Math.floor(y);
    this.type = Math.random() < 0.5 ? 'speed' : 'shield';
    this.alive = true;
    this.timer = 600;
    this.blink = 0;
  }

  update() {
    this.timer--;
    this.blink++;
    if (this.timer <= 0) this.alive = false;

    // 玩家拾取检测
    if (player && player.alive && this.alive) {
      const dx = player.x - (this.x + 0.5);
      const dy = player.y - (this.y + 0.5);
      if (Math.abs(dx) < 0.7 && Math.abs(dy) < 0.7) {
        this.apply();
        this.alive = false;
      }
    }
  }

  apply() {
    if (this.type === 'speed') {
      player.speed = Math.min(player.speed + 0.3, 2.5);
      setTimeout(() => { if (player) player.speed = 1.2; }, 10000);
    } else {
      player.invincible = 300;
    }
    score += 200;
    updateUI();
  }

  draw(ctx) {
    if (!this.alive) return;
    if (this.blink % 30 < 15) return;

    const cx = (this.x + 0.5) * CELL;
    const cy = (this.y + 0.5) * CELL;

    ctx.fillStyle = this.type === 'speed' ? '#4ecdc4' : '#ffd93d';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(cx, cy, CELL * 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // 图标
    ctx.fillStyle = '#000';
    ctx.font = '12px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.type === 'speed' ? '⚡' : '🛡️', cx, cy);
  }
}

// ==================== 游戏逻辑 ====================

function getMapTemplate(lvl) {
  return MAP_TEMPLATES[(lvl - 1) % MAP_TEMPLATES.length];
}

function loadLevel(lvl) {
  mapData = [...getMapTemplate(lvl)];
  bullets = [];
  enemies = [];
  particles = [];
  powerUps = [];
  explosions = [];

  // 玩家出生在底部中央
  player = new Tank(12.5, 24, DIR.UP, '#2ecc71', 1.2, true);
  player.invincible = 120;

  enemiesRemaining = 10 + lvl * 2;
  enemiesOnScreen = 0;
  maxEnemiesOnScreen = Math.min(4 + lvl, 8);
  enemySpawnDelay = Math.max(30, 90 - lvl * 5);
  baseEnemySpeed = 0.7 + lvl * 0.1;
  enemySpawnTimer = 60;

  updateUI();
}

function spawnEnemy() {
  if (enemiesOnScreen >= maxEnemiesOnScreen || enemiesRemaining <= 0) return;

  const sp = spawnPoints[Math.floor(Math.random() * spawnPoints.length)];
  const types = ['normal', 'normal', 'normal', 'fast', 'armored'];
  const type = level >= 2 ? types[Math.floor(Math.random() * types.length)] : 'normal';

  let color, speed, hp;
  switch (type) {
    case 'fast':
      color = '#f39c12';
      speed = baseEnemySpeed * 1.6;
      hp = 1;
      break;
    case 'armored':
      color = '#e74c3c';
      speed = baseEnemySpeed * 0.7;
      hp = 2;
      break;
    default:
      color = '#c0392b';
      speed = baseEnemySpeed;
      hp = 1;
      break;
  }

  const enemy = new Tank(sp.x + 1, sp.y + 1, DIR.DOWN, color, speed, false);
  enemy.hp = hp;
  enemy.type = type;
  enemy.invincible = 40;

  // 确保出生点不碰撞
  if (!enemy.canMoveTo(enemy.x, enemy.y, enemy.dir)) {
    return false;
  }

  enemies.push(enemy);
  enemiesOnScreen++;
  return true;
}

function update() {
  if (gameState !== STATE.PLAYING) return;

  // 检查关卡是否完成
  if (enemiesRemaining <= 0 && enemies.length === 0) {
    levelUp();
    return;
  }

  // 生成敌人
  enemySpawnTimer--;
  if (enemySpawnTimer <= 0 && enemiesRemaining > 0) {
    spawnEnemy();
    enemySpawnTimer = enemySpawnDelay + Math.floor(Math.random() * 30);
  }

  // 更新玩家
  if (player && player.alive) {
    player.update();
  } else if (player && !player.alive && lives > 0) {
    // 处理玩家死亡
    if (explosions.length === 0) {
      lives--;
      updateUI();
      if (lives <= 0) {
        gameOver(false);
      } else {
        respawnPlayer();
      }
    }
  }

  // 更新敌人
  for (const enemy of enemies) {
    if (enemy.alive) enemy.update();
  }

  // 更新子弹
  for (const bullet of bullets) {
    if (bullet.alive) bullet.update();
  }

  // 更新粒子
  for (const p of particles) {
    p.update();
  }

  // 更新道具
  for (const pu of powerUps) {
    if (pu.alive) pu.update();
  }

  // 清理
  bullets = bullets.filter(b => b.alive);
  enemies = enemies.filter(e => e.alive);
  particles = particles.filter(p => p.life > 0);
  powerUps = powerUps.filter(p => p.alive);

  // 玩家死亡检测
  if (player && !player.alive && explosions.length === 0 && lives > 0) {
    respawnPlayer();
  }
}

function respawnPlayer() {
  player = new Tank(12.5, 24, DIR.UP, '#2ecc71', 1.2, true);
  player.invincible = 120;
  updateUI();
}

function levelUp() {
  level++;
  score += 500;
  updateUI();

  // 升级动画
  showLevelUpMessage();

  setTimeout(() => {
    loadLevel(level);
  }, 2000);
}

function showLevelUpMessage() {
  // 简单地在屏幕上闪烁提示
  gameState = STATE.PAUSED;
  setTimeout(() => {
    if (gameState === STATE.PAUSED) {
      gameState = STATE.PLAYING;
    }
  }, 2000);
}

function gameOver(won) {
  gameState = STATE.GAMEOVER;
  document.getElementById('gameOverTitle').textContent = won ? '🏆 恭喜通关!' : '💥 游戏结束';
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalKills').textContent = kills;
  document.getElementById('finalLevel').textContent = level;
  document.getElementById('gameOverOverlay').classList.remove('hidden');
}

function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('level').textContent = level;
  document.getElementById('lives').textContent = Math.max(0, lives);
  document.getElementById('kills').textContent = kills;
}

function resetGame() {
  score = 0;
  level = 1;
  lives = 3;
  kills = 0;
  enemiesRemaining = 0;
  enemiesOnScreen = 0;
  maxEnemiesOnScreen = 4;
  enemySpawnTimer = 0;
  enemySpawnDelay = 90;
  baseEnemySpeed = 1.0;
  updateUI();
}

// ==================== 渲染 ====================

function drawMap() {
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const tile = mapData[y * COLS + x];
      const px = x * CELL;
      const py = y * CELL;

      switch (tile) {
        case 1: // 砖墙
          ctx.fillStyle = '#c4934a';
          ctx.fillRect(px, py, CELL, CELL);
          ctx.fillStyle = '#a07030';
          // 砖块纹理
          for (let by = 0; by < CELL; by += 8) {
            ctx.fillRect(px, py + by, CELL, 1);
          }
          for (let bx = 0; bx < CELL; bx += 12) {
            const offset = (Math.floor(by / 8) % 2) * 6;
            const lineY = py + Math.floor(Math.random() * CELL);
            ctx.fillRect(px + bx + (y % 2) * 6, py, 1, CELL);
          }
          ctx.strokeStyle = '#8b5e2b';
          ctx.lineWidth = 0.5;
          ctx.strokeRect(px + 0.5, py + 0.5, CELL - 1, CELL - 1);
          break;
        case 2: // 钢墙
          ctx.fillStyle = '#7f8c8d';
          ctx.fillRect(px, py, CELL, CELL);
          ctx.fillStyle = '#95a5a6';
          ctx.fillRect(px + 2, py + 2, CELL - 4, CELL - 4);
          ctx.fillStyle = '#bdc3c7';
          ctx.fillRect(px + 4, py + 4, CELL - 8, CELL - 8);
          // 铆钉
          ctx.fillStyle = '#555';
          [
            [4, 4], [CELL-6, 4], [4, CELL-6], [CELL-6, CELL-6]
          ].forEach(([rx, ry]) => {
            ctx.beginPath();
            ctx.arc(px + rx, py + ry, 2, 0, Math.PI * 2);
            ctx.fill();
          });
          break;
        case 3: // 水
          ctx.fillStyle = '#2471a3';
          ctx.fillRect(px, py, CELL, CELL);
          ctx.fillStyle = '#2e86c1';
          for (let wy = 0; wy < CELL; wy += 6) {
            ctx.fillRect(px + ((y * 3 + wy / 2) % 6), py + wy, CELL * 0.6, 2);
          }
          break;
        case 4: // 草丛 (只绘制在坦克下层)
          ctx.fillStyle = '#1e8449';
          ctx.fillRect(px, py, CELL, CELL);
          // 草丛纹理
          ctx.fillStyle = '#27ae60';
          for (let i = 0; i < 8; i++) {
            const gx = px + (i * 7 + x * 3) % CELL;
            const gy = py + (i * 5 + y * 7) % CELL;
            ctx.fillRect(gx, gy, 3, 6);
          }
          break;
        default:
          // 空地 - 画地面纹理
          ctx.fillStyle = '#111';
          ctx.fillRect(px, py, CELL, CELL);
          if ((x + y) % 2 === 0) {
            ctx.fillStyle = '#151515';
            ctx.fillRect(px, py, CELL, CELL);
          }
          break;
      }
    }
  }
}

function drawHUD() {
  // 右侧敌人剩余指示器
  const hudX = COLS * CELL + 5;
  const hudY = 10;

  // 简化：在屏幕右上角显示小图标
  const remainingIcons = Math.min(enemiesRemaining, 20);
  const iconSize = 6;
  for (let i = 0; i < remainingIcons; i++) {
    const row = Math.floor(i / 2);
    const col = i % 2;
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(
      COLS * CELL - 30 + col * (iconSize + 2),
      8 + row * (iconSize + 2),
      iconSize, iconSize
    );
  }
}

function render() {
  // 清屏
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 绘制地图 (不含草丛)
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const tile = mapData[y * COLS + x];
      if (tile === 4) continue; // 草丛最后画
      const px = x * CELL;
      const py = y * CELL;
      switch (tile) {
        case 1:
          ctx.fillStyle = '#c4934a';
          ctx.fillRect(px, py, CELL, CELL);
          ctx.strokeStyle = '#8b5e2b';
          ctx.lineWidth = 1;
          ctx.strokeRect(px + 0.5, py + 0.5, CELL - 1, CELL - 1);
          ctx.fillStyle = '#a07030';
          ctx.fillRect(px + 4, py + 4, CELL/2 - 4, CELL/2 - 4);
          ctx.fillRect(px + CELL/2, py + CELL/2, CELL/2 - 4, CELL/2 - 4);
          break;
        case 2:
          ctx.fillStyle = '#7f8c8d';
          ctx.fillRect(px, py, CELL, CELL);
          ctx.fillStyle = '#95a5a6';
          ctx.fillRect(px + 2, py + 2, CELL - 4, CELL - 4);
          [[3,3],[CELL-7,3],[3,CELL-7],[CELL-7,CELL-7]].forEach(([rx, ry]) => {
            ctx.fillStyle = '#555';
            ctx.beginPath();
            ctx.arc(px + rx + 2, py + ry + 2, 2, 0, Math.PI*2);
            ctx.fill();
          });
          break;
        case 3:
          ctx.fillStyle = '#2471a3';
          ctx.fillRect(px, py, CELL, CELL);
          break;
        default:
          if ((x + y) % 2 === 0) {
            ctx.fillStyle = '#111';
            ctx.fillRect(px, py, CELL, CELL);
          }
          break;
      }
    }
  }

  // 绘制道具
  for (const pu of powerUps) {
    pu.draw(ctx);
  }

  // 绘制坦克
  for (const enemy of enemies) {
    enemy.draw(ctx);
  }
  if (player && player.alive) {
    player.draw(ctx);
  }

  // 绘制子弹
  for (const bullet of bullets) {
    bullet.draw(ctx);
  }

  // 绘制粒子
  for (const p of particles) {
    p.draw(ctx);
  }

  // 绘制草丛 (在上面覆盖)
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const tile = mapData[y * COLS + x];
      if (tile === 4) {
        const px = x * CELL;
        const py = y * CELL;
        ctx.fillStyle = '#1e8449';
        ctx.fillRect(px, py, CELL, CELL);
        ctx.fillStyle = '#27ae60';
        for (let i = 0; i < 6; i++) {
          const gx = px + (i * 11 + x * 5) % CELL;
          const gy = py + (i * 7 + y * 3) % CELL;
          ctx.fillRect(gx, gy, 3, 5);
        }
      }
    }
  }

  // 关卡提示 (正在升级时)
  if (gameState === STATE.PAUSED && level > 1) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, canvas.height/2 - 30, canvas.width, 60);
    ctx.fillStyle = '#e94560';
    ctx.font = 'bold 24px "Microsoft YaHei", Arial';
    ctx.textAlign = 'center';
    ctx.fillText(`🏆 第 ${level} 关`, canvas.width/2, canvas.height/2 + 8);
  }
}

// ==================== 游戏循环 ====================

function gameLoop() {
  update();
  render();
  animationId = requestAnimationFrame(gameLoop);
}

// ==================== 事件处理 ====================

// 快捷键 P 暂停/继续
window.addEventListener('keydown', function pauseHandler(e) {
  if (e.key === 'p' || e.key === 'P') {
    if (gameState === STATE.PLAYING) {
      pauseGame();
    } else if (gameState === STATE.PAUSED) {
      resumeGame();
    }
  }
});

function pauseGame() {
  if (gameState !== STATE.PLAYING) return;
  gameState = STATE.PAUSED;
  document.getElementById('pauseOverlay').classList.remove('hidden');
}

function resumeGame() {
  if (gameState !== STATE.PAUSED) return;
  gameState = STATE.PLAYING;
  document.getElementById('pauseOverlay').classList.add('hidden');
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('resumeBtn').addEventListener('click', resumeGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

function startGame() {
  resetGame();
  document.getElementById('startOverlay').classList.add('hidden');
  document.getElementById('pauseOverlay').classList.add('hidden');
  document.getElementById('gameOverOverlay').classList.add('hidden');
  gameState = STATE.PLAYING;
  loadLevel(level);
}

// 初始加载
loadLevel(1);
// 开始时显示菜单
gameState = STATE.MENU;

// 启动游戏循环
gameLoop();

console.log('🎮 坦克大战已就绪!');
console.log('使用方向键移动，空格键射击，P键暂停');
console.log('消灭所有红色敌方坦克即可通关!');
</script>
